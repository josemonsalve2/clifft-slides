<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Interpreter to Specializer &mdash; the clifft GPU Backend</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

:root {
  --bg-dark: #1a1a2e;
  --bg-card: #161b22;
  --accent: #e94560;
  --secondary: #0f3460;
  --highlight: #53d8fb;
  --text: #e0e0e0;
  --dim: #8888aa;
  --code-bg: #0d1117;
  --success: #4ec9b0;
  --warn: #e9a045;
  --purple: #c678dd;
  --border: #30363d;
}

.reveal {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px !important;
  color: var(--text);
}
.reveal .slides { text-align: left; }
.reveal .slides section { background: var(--bg-dark); padding: 40px 50px; }

.reveal h1 { font-size: 2em !important; color: var(--accent); font-weight: 800; text-align: center; margin-bottom: 0.3em; letter-spacing: -0.02em; }
.reveal h2 { font-size: 1.45em !important; color: var(--highlight); font-weight: 700; border-bottom: 2px solid var(--accent); padding-bottom: 0.15em; margin-bottom: 0.5em; letter-spacing: -0.01em; }
.reveal h3 { font-size: 1.1em !important; color: var(--accent); font-weight: 700; margin-bottom: 0.3em; }
.reveal h4 { font-size: 0.92em !important; color: var(--highlight); font-weight: 600; margin-bottom: 0.2em; }

.reveal p, .reveal li { font-size: 0.82em !important; line-height: 1.6; }
.reveal ul { margin-left: 1.2em; }
.reveal li { margin-bottom: 0.25em; }
.reveal code { background: var(--bg-card); color: var(--highlight); padding: 0.15em 0.4em; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
.reveal pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.8em; margin: 0.5em 0; overflow-x: auto; }
.reveal pre code { background: transparent; padding: 0; font-size: 0.72em; line-height: 1.5; color: var(--text); display: block; }
.reveal strong { color: var(--accent); font-weight: 700; }
.reveal em { color: var(--highlight); font-style: normal; }
.reveal hr { border: none; border-top: 1px solid var(--border); margin: 0.6em 0; }

.reveal table { font-size: 0.72em; border-collapse: collapse; width: 100%; margin: 0.5em 0; }
.reveal th { background: var(--secondary); color: var(--highlight); padding: 0.45em 0.7em; border: 1px solid var(--border); text-align: left; font-weight: 700; }
.reveal td { padding: 0.4em 0.7em; border: 1px solid var(--border); }
.reveal table.tight { font-size: 0.62em; }
.reveal table.tight th, .reveal table.tight td { padding: 0.25em 0.45em; }
.num { font-family: 'JetBrains Mono', monospace; text-align: right; }
.win { color: var(--success); font-weight: 700; }
.lose { color: var(--accent); font-weight: 700; }

.title-slide { text-align: center !important; display: flex !important; flex-direction: column; align-items: center; justify-content: center; }
.title-slide h1 { font-size: 3.2em !important; margin-bottom: 0.05em; line-height: 1.1; }
.title-slide .subtitle { font-size: 1em; color: var(--highlight); margin-bottom: 1.8em; font-weight: 600; }
.title-slide .meta { font-size: 0.72em; color: var(--dim); line-height: 1.8; }
.title-slide .tagline { font-size: 0.68em; color: var(--dim); margin-top: 1.5em; border-top: 1px solid var(--border); padding-top: 0.8em; max-width: 560px; }

.section-divider { text-align: center !important; display: flex !important; flex-direction: column; align-items: center; justify-content: center; }
.section-divider .section-num { font-size: 5em; font-weight: 900; color: var(--secondary); opacity: 0.4; margin-bottom: -0.25em; line-height: 1; }
.section-divider h1 { font-size: 2.4em !important; margin-bottom: 0.15em; }
.section-divider .section-sub { font-size: 0.75em; color: var(--dim); max-width: 560px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8em; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6em; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 1em; }
.grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 1em; }
.grid-60-40 { display: grid; grid-template-columns: 3fr 2fr; gap: 1em; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 0.75em; margin: 0.3em 0; }
.card-accent { border-left: 3px solid var(--accent); }
.card-hl { border-left: 3px solid var(--highlight); }
.card-success { border-left: 3px solid var(--success); }
.card-warn { border-left: 3px solid var(--warn); }
.card-purple { border-left: 3px solid var(--purple); }
.card .h { font-weight: 700; font-size: 0.8em; margin-bottom: 0.25em; }
.card .d { font-size: 0.68em; color: var(--dim); line-height: 1.5; }

.box { display: inline-flex; align-items: center; justify-content: center; padding: 0.4em 0.85em; border-radius: 8px; font-size: 0.72em; font-weight: 700; text-align: center; line-height: 1.3; white-space: nowrap; }
.box-primary { background: rgba(15,52,96,0.5); border: 2px solid var(--highlight); color: var(--highlight); }
.box-accent { background: rgba(233,69,96,0.12); border: 2px solid var(--accent); color: var(--accent); }
.box-success { background: rgba(78,201,176,0.1); border: 2px solid var(--success); color: var(--success); }
.box-warn { background: rgba(233,160,69,0.1); border: 2px solid var(--warn); color: var(--warn); }
.box-purple { background: rgba(198,120,221,0.1); border: 2px solid var(--purple); color: var(--purple); }
.box-dim { background: rgba(136,136,170,0.1); border: 2px solid var(--dim); color: var(--dim); }

.arrow { color: var(--dim); font-size: 1.3em; margin: 0 0.3em; display: inline-flex; align-items: center; }
.flow-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.2em; margin: 0.5em 0; }
.flow-col { display: flex; flex-direction: column; align-items: center; gap: 0.15em; margin: 0.4em 0; }

.big-num { font-size: 2.5em; font-weight: 800; color: var(--accent); text-align: center; margin: 0.15em 0; line-height: 1; }
.big-label { font-size: 0.7em; color: var(--dim); text-align: center; }

.insight { background: rgba(233,69,96,0.08); border: 1px solid rgba(233,69,96,0.3); border-radius: 8px; padding: 0.55em 0.75em; margin: 0.5em 0; font-size: 0.78em; line-height: 1.5; }
.insight::before { content: "\1F4A1  "; }

.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6em; margin: 0.4em 0; }
.summary-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 0.65em 0.8em; text-align: center; }
.summary-card .num { font-size: 1.8em; font-weight: 800; line-height: 1; margin-bottom: 0.1em; }
.summary-card .txt { font-size: 0.65em; color: var(--dim); }

.stat-callout { text-align: center; padding: 0.8em; background: rgba(233,69,96,0.1); border: 2px solid var(--accent); border-radius: 12px; margin: 0.5em auto; max-width: 560px; }
.stat-callout .stat-num { font-size: 2.5em; font-weight: 800; color: var(--accent); line-height: 1; }
.stat-callout .stat-label { font-size: 0.75em; color: var(--dim); margin-top: 0.2em; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8em; }

/* ---- Figures.  Diagrams live in diagrams/ and are <img>-embedded so the
       deck and the report render byte-identical artwork. ---- */
figure { margin: 0.3em 0; text-align: center; }
figure img { width: 100%; max-width: 100%; border-radius: 8px; display: block; margin: 0 auto; }
figure img.narrow { max-width: 74%; }
figure img.mid { max-width: 86%; }
figcaption { font-size: 0.6em !important; color: var(--dim); line-height: 1.45; margin-top: 0.3em; text-align: center; }
figcaption b { color: var(--highlight); }

/* ---- Progressive-lowering diffs.  A lowering step is only legible when you
       can see which lines the pass touched, so removed/added/context are
       coloured the way a reviewer expects from a unified diff. ---- */
.diff { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.6em 0.8em;
        font-family: 'JetBrains Mono', monospace; font-size: 0.56em; line-height: 1.55; overflow-x: auto; margin: 0.35em 0; }
.diff .hunk { color: var(--purple); display: block; }
.diff .ctx  { color: #7d8590; display: block; }
.diff .del  { color: #ff9daa; background: rgba(248,81,73,0.16); display: block; border-left: 2px solid #f85149; padding-left: 0.4em; margin-left: -0.4em; }
.diff .add  { color: #7ee2a8; background: rgba(63,185,80,0.16);  display: block; border-left: 2px solid #3fb950; padding-left: 0.4em; margin-left: -0.4em; }
.diff .note { color: var(--dim); display: block; font-style: italic; }
.diff-title { font-size: 0.62em; color: var(--dim); font-family: 'JetBrains Mono', monospace; margin: 0.2em 0 0.1em; }
.diff-title b { color: var(--highlight); font-weight: 700; }

/* Syntax accents inside plain <pre> blocks -- applied by hand, no highlighter. */
.kw { color: var(--purple); }
.fn { color: var(--highlight); }
.st { color: var(--warn); }
.cm { color: #6a737d; font-style: italic; }
.lit { color: var(--success); }

.lede { font-size: 0.86em !important; color: var(--dim); margin-bottom: 0.5em; line-height: 1.55; }
.verdict { text-align: center; font-size: 0.85em; font-weight: 700; padding: 0.5em; border-radius: 8px; margin-top: 0.4em; }
.verdict-good { background: rgba(78,201,176,0.12); border: 1px solid var(--success); color: var(--success); }
.verdict-bad  { background: rgba(233,69,96,0.12);  border: 1px solid var(--accent);  color: var(--accent); }
.verdict-mixed{ background: rgba(233,160,69,0.12); border: 1px solid var(--warn);    color: var(--warn); }

.src { font-family: 'JetBrains Mono', monospace; font-size: 0.6em; color: var(--dim); }
.footnote { font-size: 0.6em !important; color: var(--dim); border-top: 1px solid var(--border); padding-top: 0.35em; margin-top: 0.5em; }

/* Horizontal ratio bars -- one row per circuit, width encodes V2/SVM. */
.bars { margin: 0.4em 0; }
.bar-row { display: grid; grid-template-columns: 190px 1fr 62px; align-items: center; gap: 0.5em; margin: 0.16em 0; font-size: 0.6em; }
.bar-row .nm { font-family: 'JetBrains Mono', monospace; color: var(--dim); text-align: right; }
.bar-row .tr { background: #21262d; border-radius: 4px; height: 15px; position: relative; }
.bar-row .fl { height: 100%; border-radius: 4px; }
.bar-row .vl { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.bar-base { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); opacity: 0.85; }

@media (max-width: 900px) {
  .grid-2, .grid-3, .grid-4, .grid-60-40, .grid-2-1, .grid-1-2, .cols { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
<div class="reveal">
  <div class="slides">
