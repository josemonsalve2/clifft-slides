<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Two Lowering Pipelines, Same Circuit</title>
  <desc id="desc">Side-by-side V1 and V2 lowering pipelines for circuit_d3, with stage widths proportional to line counts, a frame_h inset, endpoint comparison, and opposite-shape conclusion.</desc>

  <defs>
    <linearGradient id="v1Fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cc2222" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="v2Fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="endpointFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#e94560" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#53d8fb" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glowRed" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc2222"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
    <marker id="arrowNeutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#aeb4c7"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#1a1a2e"/>
  <path d="M0 58 H1000 M0 499 H1000 M0 568 H1000" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M30 0 V620 M970 0 V620" stroke="#ffffff" stroke-opacity="0.025"/>

  <!-- Title -->
  <text x="500" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Two Lowering Pipelines, Same Circuit</text>
  <text x="500" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">circuit_d3 · 344 bytecode instructions · lines per stage</text>

  <!-- Pipeline panels -->
  <rect x="30" y="66" width="440" height="372" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.55"/>
  <rect x="530" y="66" width="440" height="372" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#e94560" stroke-opacity="0.65"/>
  <rect x="30" y="66" width="440" height="27" rx="9" fill="#cc2222" fill-opacity="0.16"/>
  <rect x="530" y="66" width="440" height="27" rx="9" fill="#e94560" fill-opacity="0.16"/>
  <text x="250" y="84" fill="#ff7777" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">V1 · MLIR pipeline</text>
  <text x="750" y="84" fill="#ff8296" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">V2 · C / Clang pipeline</text>

  <!-- Source ratio -->
  <g>
    <line x1="250" y1="96" x2="750" y2="96" stroke="#aeb4c7" stroke-width="1.2" stroke-opacity="0.72"/>
    <path d="M250 91 V101 M750 91 V101" stroke="#aeb4c7" stroke-width="1.2"/>
    <rect x="421" y="88" width="158" height="20" rx="10" fill="#1a1a2e" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="500" y="102" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">23,002 / 383 = 60×</text>
  </g>

  <!-- V1 stages -->
  <g>
    <text x="50" y="120" fill="#dfe3ed" font-family="monospace" font-size="10.5">1_emitted.mlir</text>
    <text x="450" y="120" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">23,002</text>
    <rect x="70" y="127" width="360" height="20" rx="5" fill="url(#v1Fill)" stroke="#cc2222" stroke-width="1.5"/>

    <line x1="250" y1="149" x2="250" y2="160" stroke="#cc2222" stroke-width="1.4" marker-end="url(#arrowRed)"/>
    <text x="50" y="170" fill="#dfe3ed" font-family="monospace" font-size="10.5">2_opt.mlir</text>
    <text x="450" y="170" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">14,257</text>
    <rect x="138.4" y="177" width="223.2" height="20" rx="5" fill="url(#v1Fill)" stroke="#cc2222" stroke-width="1.5"/>

    <line x1="250" y1="199" x2="250" y2="210" stroke="#cc2222" stroke-width="1.4" marker-end="url(#arrowRed)"/>
    <text x="50" y="220" fill="#dfe3ed" font-family="monospace" font-size="10.5">3_translate.ll</text>
    <text x="450" y="220" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">14,875</text>
    <rect x="133.6" y="227" width="232.8" height="20" rx="5" fill="url(#v1Fill)" stroke="#cc2222" stroke-width="1.5"/>

    <line x1="250" y1="249" x2="250" y2="260" stroke="#cc2222" stroke-width="1.4" marker-end="url(#arrowRed)"/>
    <text x="50" y="270" fill="#dfe3ed" font-family="monospace" font-size="10.5">4_optO2.ll</text>
    <text x="450" y="270" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">13,747</text>
    <rect x="142.4" y="277" width="215.2" height="20" rx="5" fill="url(#v1Fill)" stroke="#cc2222" stroke-width="1.5"/>

    <line x1="250" y1="299" x2="250" y2="310" stroke="#cc2222" stroke-width="1.4" marker-end="url(#arrowRed)"/>
    <text x="50" y="320" fill="#dfe3ed" font-family="monospace" font-size="10.5">5_isa.s</text>
    <text x="450" y="320" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">17,802</text>
    <rect x="110.7" y="327" width="278.6" height="20" rx="5" fill="url(#v1Fill)" stroke="#cc2222" stroke-width="1.5"/>
  </g>

  <!-- V2 stages -->
  <g>
    <text x="550" y="120" fill="#dfe3ed" font-family="monospace" font-size="10.5">1_emitted.c</text>
    <text x="950" y="120" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">383</text>
    <rect x="747" y="127" width="6" height="20" rx="3" fill="#e94560" stroke="#ff8296" stroke-width="1.5" filter="url(#glowCyan)"/>

    <line x1="750" y1="149" x2="750" y2="176" stroke="#53d8fb" stroke-width="1.4" marker-end="url(#arrowCyan)"/>
    <text x="550" y="186" fill="#dfe3ed" font-family="monospace" font-size="10.5">2_clangO0.ll</text>
    <text x="950" y="186" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">19,551</text>
    <rect x="597" y="193" width="306" height="20" rx="5" fill="url(#v2Fill)" stroke="#e94560" stroke-width="1.5"/>

    <line x1="750" y1="215" x2="750" y2="242" stroke="#53d8fb" stroke-width="1.4" marker-end="url(#arrowCyan)"/>
    <text x="550" y="252" fill="#dfe3ed" font-family="monospace" font-size="10.5">3_clangO2.ll</text>
    <text x="950" y="252" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">8,132</text>
    <rect x="686.4" y="259" width="127.2" height="20" rx="5" fill="url(#v2Fill)" stroke="#e94560" stroke-width="1.5"/>

    <line x1="750" y1="281" x2="750" y2="310" stroke="#53d8fb" stroke-width="1.4" marker-end="url(#arrowCyan)"/>
    <text x="550" y="320" fill="#dfe3ed" font-family="monospace" font-size="10.5">4_isa.s</text>
    <text x="950" y="320" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">10,398</text>
    <rect x="668.6" y="327" width="162.8" height="20" rx="5" fill="url(#v2Fill)" stroke="#e94560" stroke-width="1.5"/>
  </g>

  <!-- ISA ratio -->
  <g>
    <line x1="250" y1="355" x2="750" y2="355" stroke="#aeb4c7" stroke-width="1.2" stroke-opacity="0.72"/>
    <path d="M250 350 V360 M750 350 V360" stroke="#aeb4c7" stroke-width="1.2"/>
    <rect x="405" y="345" width="190" height="20" rx="10" fill="#1a1a2e" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="500" y="359" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">17,802 / 10,398 = 1.7×</text>
  </g>

  <!-- V1 arc annotation -->
  <g>
    <rect x="50" y="374" width="400" height="48" rx="7" fill="#cc2222" fill-opacity="0.12" stroke="#cc2222" stroke-opacity="0.75"/>
    <text x="104.0" y="393" fill="#ff7777" font-family="Arial, sans-serif" font-size="11.5" font-weight="700">starts huge and shrinks — every stage is</text><text x="332.7" y="393" fill="#ff7777" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" font-style="italic">recovering</text>
    <text x="250" y="409" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11.5" text-anchor="middle">from the emitter.</text>
  </g>

  <!-- V2 arc annotation -->
  <g>
    <rect x="550" y="369" width="400" height="58" rx="7" fill="#53d8fb" fill-opacity="0.09" stroke="#53d8fb" stroke-opacity="0.78"/>
    <text x="750" y="385" fill="#75e3ff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">starts tiny, expands at -O0, collapses at -O2.</text>
    <text x="750" y="399" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">The expansion is a compiler artifact — -O0 gives every local</text>
    <text x="547.8" y="413" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">an</text><text x="562.2" y="413" fill="#dfe3ed" font-family="monospace" font-size="10.5">alloca</text><text x="606.0" y="413" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">and every access an</text><text x="704.6" y="413" fill="#dfe3ed" font-family="monospace" font-size="10.5">addrspacecast</text><text x="792.2" y="413" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">— not something</text>
    <text x="750" y="425" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">the emitter wrote down.</text>
  </g>

  <!-- Endpoint comparison -->
  <g>
    <rect x="30" y="445" width="940" height="48" rx="9" fill="url(#endpointFill)" stroke="#e94560" stroke-opacity="0.85"/>
    <text x="500" y="466" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" filter="url(#glowRed)">17,802 vs 10,398 ISA lines.</text>
    <text x="272.0" y="484" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="13" font-weight="700">V2 produces a</text><text x="364.6" y="484" fill="#53d8fb" font-family="Arial, sans-serif" font-size="13" font-weight="700">1.7× smaller kernel</text><text x="484.1" y="484" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="13" font-weight="700">from a</text><text x="527.2" y="484" fill="#e94560" font-family="Arial, sans-serif" font-size="13" font-weight="700">60× smaller source.</text>
  </g>

  <!-- frame_h inset -->
  <g>
    <rect x="30" y="505" width="940" height="57" rx="8" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="48" y="523" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700">frame_h · 4 instructions</text>
    <text x="48" y="541" fill="#ff7777" font-family="Arial, sans-serif" font-size="9.5" font-weight="700">V1 rendered chain</text>

    <text x="245" y="521" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">1_emitted.mlir</text>
    <text x="245" y="534" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">947</text>
    <rect x="197" y="542" width="96" height="7" rx="3.5" fill="#cc2222" fill-opacity="0.42"/>

    <line x1="298" y1="545.5" x2="307" y2="545.5" stroke="#aeb4c7" stroke-width="1" marker-end="url(#arrowNeutral)"/>
    <text x="357" y="521" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">2_opt.mlir</text>
    <text x="357" y="534" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">606</text>
    <rect x="326.5" y="542" width="61" height="7" rx="3.5" fill="#cc2222" fill-opacity="0.36"/>

    <line x1="410" y1="545.5" x2="419" y2="545.5" stroke="#aeb4c7" stroke-width="1" marker-end="url(#arrowNeutral)"/>
    <text x="469" y="521" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">3_translate.ll</text>
    <text x="469" y="534" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">562</text>
    <rect x="440.5" y="542" width="57" height="7" rx="3.5" fill="#cc2222" fill-opacity="0.34"/>

    <line x1="522" y1="545.5" x2="531" y2="545.5" stroke="#aeb4c7" stroke-width="1" marker-end="url(#arrowNeutral)"/>
    <text x="581" y="521" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">4_optO2.ll</text>
    <text x="581" y="534" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">275</text>
    <rect x="567" y="542" width="28" height="7" rx="3.5" fill="#cc2222" fill-opacity="0.30"/>

    <line x1="634" y1="545.5" x2="643" y2="545.5" stroke="#aeb4c7" stroke-width="1" marker-end="url(#arrowNeutral)"/>
    <text x="693" y="521" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">5_isa.s</text>
    <text x="693" y="534" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">524</text>
    <rect x="666.5" y="542" width="53" height="7" rx="3.5" fill="#cc2222" fill-opacity="0.33"/>

    <line x1="744" y1="512" x2="744" y2="555" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="857" y="526" fill="#ff8296" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">V2: no rendered chain</text>
    <text x="797.6" y="545" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">emitted C ·</text><text x="851.7" y="545" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700">43 lines</text>
  </g>

  <!-- Punchline -->
  <g>
    <rect x="30" y="574" width="940" height="36" rx="9" fill="#e94560" fill-opacity="0.14" stroke="#e94560"/>
    <text x="500" y="598" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Two shapes, and they are opposites.</text>
  </g>
</svg>
