<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="590" viewBox="0 0 1060 590" role="img" aria-labelledby="title desc">
  <title id="title">256 Threads Doing the Work of One</title>
  <desc id="desc">The rank 0 frame_h circuit before and after cooperation became a compile-time parameter: 256 threads per shot with four barriers becomes one shot per thread with no barriers.</desc>

  <defs>
    <linearGradient id="beforeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc2222" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="afterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00cc66" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00cc66" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="codeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0d1a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d0d1a" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="idleGrid" width="9" height="4.375" patternUnits="userSpaceOnUse">
      <rect x="0.6" y="0.5" width="7.8" height="3.3" rx="0.8" fill="#69708a" fill-opacity="0.52"/>
    </pattern>
    <pattern id="activeGrid" width="9" height="4.125" patternUnits="userSpaceOnUse">
      <rect x="0.6" y="0.5" width="7.8" height="3.1" rx="0.8" fill="#00cc66" fill-opacity="0.86"/>
    </pattern>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
  </defs>

  <rect width="1060" height="590" fill="#1a1a2e"/>
  <path d="M0 58 H1060 M0 531 H1060" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M24 0 V590 M1036 0 V590" stroke="#ffffff" stroke-opacity="0.025"/>

  <text x="530" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">256 Threads Doing the Work of One</text>
  <text x="530" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Rank 0 in the coop topology — and what changed when cooperation became a compile-time parameter</text>

  <!-- Before topology -->
  <rect x="24" y="66" width="1012" height="120" rx="10" fill="url(#beforeFill)" stroke="#cc2222" stroke-width="1.5"/>
  <rect x="24" y="66" width="1012" height="24" rx="9" fill="#cc2222" fill-opacity="0.22"/>
  <text x="42" y="83" fill="#ff7777" font-family="Arial, sans-serif" font-size="11" font-weight="700">BEFORE · 256 threads cooperate on one shot</text>
  <text x="999" y="83" fill="#dfe3ed" font-family="monospace" font-size="10" text-anchor="end">frame_h · rank 0 · four instructions · four barriers</text>

  <!-- Before lane grid -->
  <rect x="42" y="96" width="144" height="70" rx="4" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.8"/>
  <rect x="42" y="96" width="144" height="70" rx="4" fill="url(#idleGrid)"/>
  <rect x="42.6" y="96.6" width="7.8" height="3.8" rx="0.8" fill="#e94560" filter="url(#glowRed)"/>
  <rect x="50" y="108" width="128" height="18" rx="4" fill="#0d0d1a" fill-opacity="0.88" stroke="#e94560" stroke-opacity="0.65"/>
  <text x="114" y="121" fill="#e94560" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">IS_OWNER (t == 0)</text>
  <rect x="50" y="134" width="128" height="18" rx="4" fill="#0d0d1a" fill-opacity="0.88" stroke="#69708a" stroke-opacity="0.8"/>
  <text x="114" y="147" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">255 lanes idle</text>
  <text x="42" y="179" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">SVM: one shot per thread</text>

  <!-- Before instruction timeline -->
  <g font-family="Arial, sans-serif">
    <rect x="215" y="94" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.65"/>
    <text x="310" y="108" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">frame_h instruction</text>
    <rect x="228" y="116" width="164" height="18" rx="3" fill="#69708a" fill-opacity="0.32"/>
    <rect x="228" y="116" width="7" height="18" rx="2" fill="#e94560"/>
    <text x="310" y="129" fill="#9ba3b8" font-size="9" text-anchor="middle">one lane active · 255 idle</text>
    <rect x="228" y="143" width="164" height="14" rx="3" fill="#cc2222" fill-opacity="0.42" stroke="#ef5555"/>
    <text x="310" y="153.5" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">s_barrier</text>

    <rect x="413" y="94" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.65"/>
    <text x="508" y="108" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">frame_h instruction</text>
    <rect x="426" y="116" width="164" height="18" rx="3" fill="#69708a" fill-opacity="0.32"/>
    <rect x="426" y="116" width="7" height="18" rx="2" fill="#e94560"/>
    <text x="508" y="129" fill="#9ba3b8" font-size="9" text-anchor="middle">one lane active · 255 idle</text>
    <rect x="426" y="143" width="164" height="14" rx="3" fill="#cc2222" fill-opacity="0.42" stroke="#ef5555"/>
    <text x="508" y="153.5" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">s_barrier</text>

    <rect x="611" y="94" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.65"/>
    <text x="706" y="108" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">frame_h instruction</text>
    <rect x="624" y="116" width="164" height="18" rx="3" fill="#69708a" fill-opacity="0.32"/>
    <rect x="624" y="116" width="7" height="18" rx="2" fill="#e94560"/>
    <text x="706" y="129" fill="#9ba3b8" font-size="9" text-anchor="middle">one lane active · 255 idle</text>
    <rect x="624" y="143" width="164" height="14" rx="3" fill="#cc2222" fill-opacity="0.42" stroke="#ef5555"/>
    <text x="706" y="153.5" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">s_barrier</text>

    <rect x="809" y="94" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.65"/>
    <text x="904" y="108" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">frame_h instruction</text>
    <rect x="822" y="116" width="164" height="18" rx="3" fill="#69708a" fill-opacity="0.32"/>
    <rect x="822" y="116" width="7" height="18" rx="2" fill="#e94560"/>
    <text x="904" y="129" fill="#9ba3b8" font-size="9" text-anchor="middle">one lane active · 255 idle</text>
    <rect x="822" y="143" width="164" height="14" rx="3" fill="#cc2222" fill-opacity="0.42" stroke="#ef5555"/>
    <text x="904" y="153.5" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">s_barrier</text>
  </g>
  <text x="215" y="179" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="10">amplitudes in LDS — for a circuit with no amplitudes worth speaking of</text>

  <!-- Compile-time mechanism -->
  <rect x="24" y="194" width="1012" height="205" rx="10" fill="url(#codeFill)" stroke="#53d8fb" stroke-opacity="0.55"/>
  <rect x="36" y="205" width="700" height="183" rx="7" fill="#0d0d1a" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="50" y="222" fill="#53d8fb" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">THE COMPILE-TIME TOPOLOGY KNOB</text>
  <g font-family="monospace" font-size="9.5" xml:space="preserve">
    <text x="50" y="239" fill="#53d8fb">#ifdef V2_REGISTER</text>
    <text x="50" y="252" fill="#8ff7bf">#  define V2_STRIDE 1u</text>
    <text x="50" y="265" fill="#dfe3ed">   static inline u32 v2_tid(void)  { return 0u; }</text>
    <text x="50" y="278" fill="#8ff7bf">#  define IS_OWNER 1</text>
    <text x="50" y="291" fill="#9ba3b8">   /* v2_barrier() -&gt; nothing; V2_REDUCE2 -&gt; identity */</text>
    <text x="50" y="304" fill="#53d8fb">#else</text>
    <text x="50" y="317" fill="#ffb35c">#  define V2_STRIDE 256u</text>
    <text x="50" y="330" fill="#dfe3ed">   static inline u32 v2_tid(void)  { return __builtin_amdgcn_workitem_id_x(); }</text>
    <text x="50" y="343" fill="#ffb35c">#  define IS_OWNER (t == 0)</text>
    <text x="50" y="356" fill="#9ba3b8">   /* v2_barrier() -&gt; fenced s_barrier; V2_REDUCE2 -&gt; coop_reduce2 butterfly */</text>
    <text x="50" y="369" fill="#53d8fb">#endif</text>
  </g>

  <!-- Mechanism callout -->
  <rect x="752" y="205" width="272" height="183" rx="7" fill="#53d8fb" fill-opacity="0.07" stroke="#53d8fb" stroke-width="1.5"/>
  <rect x="780" y="224" width="216" height="30" rx="6" fill="#cc2222" fill-opacity="0.18" stroke="#cc2222"/>
  <text x="888" y="244" fill="#ff8e8e" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">COOP / GLOBAL TOPOLOGY</text>
  <line x1="888" y1="262" x2="888" y2="296" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)" filter="url(#glowCyan)"/>
  <rect x="780" y="304" width="216" height="30" rx="6" fill="#00cc66" fill-opacity="0.15" stroke="#00cc66"/>
  <text x="888" y="324" fill="#8ff7bf" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">REGISTER TOPOLOGY</text>
  <text x="888" y="349" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">The tier knob parameterizes</text>
  <text x="888" y="363" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" font-style="italic" text-anchor="middle">cooperation, not arithmetic.</text>
  <text x="888" y="378" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">One source, two topologies, byte-exact.</text>

  <!-- After topology -->
  <rect x="24" y="407" width="1012" height="120" rx="10" fill="url(#afterFill)" stroke="#00cc66" stroke-width="1.5"/>
  <rect x="24" y="407" width="1012" height="24" rx="9" fill="#00cc66" fill-opacity="0.18"/>
  <text x="42" y="424" fill="#8ff7bf" font-family="Arial, sans-serif" font-size="11" font-weight="700">AFTER · 256 threads · one shot per thread</text>
  <text x="42" y="443" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">no idle lanes</text>

  <!-- After lane grid -->
  <rect x="42" y="451" width="144" height="66" rx="4" fill="#0d0d1a" fill-opacity="0.72" stroke="#00cc66" stroke-opacity="0.85"/>
  <rect x="42" y="451" width="144" height="66" rx="4" fill="url(#activeGrid)" filter="url(#glowGreen)"/>

  <!-- After instruction timeline -->
  <g font-family="Arial, sans-serif">
    <rect x="215" y="438" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#00cc66" stroke-opacity="0.68"/>
    <text x="310" y="453" fill="#8ff7bf" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">IS_OWNER 1</text>
    <rect x="228" y="461" width="164" height="18" rx="3" fill="#00cc66" fill-opacity="0.62"/>
    <text x="310" y="474" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">every lane active</text>
    <rect x="228" y="487" width="164" height="14" rx="3" fill="#69708a" fill-opacity="0.12" stroke="#9ba3b8" stroke-dasharray="3 3"/>
    <line x1="231" y1="501" x2="389" y2="487" stroke="#00cc66" stroke-width="2"/>
    <text x="310" y="497.5" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">v2_barrier() → nothing</text>

    <rect x="413" y="438" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#00cc66" stroke-opacity="0.68"/>
    <text x="508" y="453" fill="#8ff7bf" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">V2_STRIDE 1u</text>
    <rect x="426" y="461" width="164" height="18" rx="3" fill="#00cc66" fill-opacity="0.62"/>
    <text x="508" y="474" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">every lane active</text>
    <rect x="426" y="487" width="164" height="14" rx="3" fill="#69708a" fill-opacity="0.12" stroke="#9ba3b8" stroke-dasharray="3 3"/>
    <line x1="429" y1="501" x2="587" y2="487" stroke="#00cc66" stroke-width="2"/>
    <text x="508" y="497.5" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">v2_barrier() → nothing</text>

    <rect x="611" y="438" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#00cc66" stroke-opacity="0.68"/>
    <text x="706" y="453" fill="#8ff7bf" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">V2_REDUCE2 → identity</text>
    <rect x="624" y="461" width="164" height="18" rx="3" fill="#00cc66" fill-opacity="0.62"/>
    <text x="706" y="474" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">already summed everything</text>
    <rect x="624" y="487" width="164" height="14" rx="3" fill="#69708a" fill-opacity="0.12" stroke="#9ba3b8" stroke-dasharray="3 3"/>
    <line x1="627" y1="501" x2="785" y2="487" stroke="#00cc66" stroke-width="2"/>
    <text x="706" y="497.5" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">v2_barrier() → nothing</text>

    <rect x="809" y="438" width="190" height="72" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#00cc66" stroke-opacity="0.68"/>
    <text x="904" y="453" fill="#8ff7bf" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">GpuComplex v[16] in VGPRs</text>
    <rect x="822" y="461" width="164" height="18" rx="3" fill="#00cc66" fill-opacity="0.62"/>
    <text x="904" y="474" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">not LDS</text>
    <rect x="822" y="487" width="164" height="14" rx="3" fill="#69708a" fill-opacity="0.12" stroke="#9ba3b8" stroke-dasharray="3 3"/>
    <line x1="825" y1="501" x2="983" y2="487" stroke="#00cc66" stroke-width="2"/>
    <text x="904" y="497.5" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">v2_barrier() → nothing</text>
  </g>
  <text x="607" y="522" fill="#8ff7bf" font-family="monospace" font-size="9" text-anchor="middle">for (i = t; i &lt; iters; i += 256) → for (i = 0; i &lt; iters; i += 1)</text>

  <!-- Exact result strip -->
  <rect x="24" y="536" width="1012" height="46" rx="9" fill="#e94560" fill-opacity="0.12" stroke="#e94560"/>
  <text x="44" y="554" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">frame_h (rank 0)</text>
  <text x="315" y="554" fill="#ff7777" font-family="Arial, sans-serif" font-size="13" font-weight="700">before 28.258</text>
  <line x1="425" y1="550" x2="478" y2="550" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="493" y="554" fill="#00ff80" font-family="Arial, sans-serif" font-size="13" font-weight="700">after P0+P1 1.215</text>
  <text x="790" y="554" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" font-weight="700">V2/SVM</text>
  <text x="530" y="575" fill="#aeb4c7" font-family="monospace" font-size="9.5" text-anchor="middle">commit 715f8d0 · frame_h 30.6x→1.14x · circuit_d3 14.1x→1.13x · Byte-exact vs SVM: 38/38.</text>
</svg>
