<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Static Rank Tracking — the specializer knows k at every call site</title>
  <desc id="desc">A static program walk tracks k, folds rank-dependent expressions at their use sites, and changes the scalar-load ledger from 6 to 4 compile-time-addressed loads.</desc>

  <defs>
    <linearGradient id="walkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53d8fb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#53d8fb" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="foldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ledgerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00cc66" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#00cc66" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00cc66"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#1a1a2e"/>
  <path d="M0 63 H1100 M0 489 H1100" stroke="#ffffff" stroke-opacity="0.07"/>
  <path d="M22 63 V489 M1078 63 V489" stroke="#ffffff" stroke-opacity="0.025"/>

  <text x="210.0" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Static Rank Tracking — the specializer knows</text><text x="671.8" y="31" fill="#ffffff" font-family="monospace" font-size="21" font-weight="700">k</text><text x="697.1" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">at every call site</text>
  <text x="550" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">S3 · 164→83 instructions (1.98×) · VALU 67→27 (2.48×) · VGPR 18→8 · SGPR 16→10</text>

  <!-- Static program walk -->
  <rect x="22" y="74" width="210" height="403" rx="10" fill="url(#walkFill)" stroke="#53d8fb" stroke-width="1.5"/>
  <rect x="22" y="74" width="210" height="31" rx="9" fill="#53d8fb" fill-opacity="0.14"/>
  <text x="127" y="95" fill="#8de7fc" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STATIC PROGRAM WALK</text>

  <text x="35" y="122" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.6">BYTECODE</text>
  <text x="218" y="122" fill="#53d8fb" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="0.6">TRACKED k</text>
  <line x1="34" y1="130" x2="220" y2="130" stroke="#ffffff" stroke-opacity="0.10"/>
  <line x1="151" y1="113" x2="151" y2="360" stroke="#53d8fb" stroke-opacity="0.22"/>

  <g font-family="monospace" font-size="10.5">
    <text x="35" y="151" fill="#dfe3ed">FRAME OP</text>
    <text x="218" y="151" fill="#53d8fb" text-anchor="end" font-weight="700">unchanged</text>
    <line x1="34" y1="162" x2="220" y2="162" stroke="#ffffff" stroke-opacity="0.07"/>

    <text x="35" y="184" fill="#ffffff" font-weight="700">EXPAND</text>
    <text x="218" y="184" fill="#53d8fb" text-anchor="end" font-weight="700">1→2</text>
    <rect x="34" y="191" width="186" height="24" rx="5" fill="#53d8fb" fill-opacity="0.12" stroke="#53d8fb" stroke-opacity="0.55"/>
    <text x="127" y="207" fill="#b9f2ff" text-anchor="middle" font-size="9.5">active_k = 2u  ·  folded here</text>
    <line x1="34" y1="220" x2="220" y2="220" stroke="#ffffff" stroke-opacity="0.07"/>

    <text x="35" y="244" fill="#dfe3ed">ARRAY OP</text>
    <text x="218" y="244" fill="#53d8fb" text-anchor="end" font-weight="700">k = 2</text>
    <line x1="34" y1="255" x2="220" y2="255" stroke="#ffffff" stroke-opacity="0.07"/>

    <text x="35" y="279" fill="#ffffff" font-weight="700">EXPAND</text>
    <text x="218" y="279" fill="#53d8fb" text-anchor="end" font-weight="700">2→3</text>
    <line x1="34" y1="290" x2="220" y2="290" stroke="#ffffff" stroke-opacity="0.07"/>

    <text x="35" y="314" fill="#dfe3ed">ARRAY OP</text>
    <text x="218" y="314" fill="#53d8fb" text-anchor="end" font-weight="700">k = 3</text>
    <line x1="34" y1="325" x2="220" y2="325" stroke="#ffffff" stroke-opacity="0.07"/>

    <text x="35" y="349" fill="#dfe3ed">MEASURE</text>
    <text x="218" y="349" fill="#53d8fb" text-anchor="end" font-weight="700">3→2</text>
    <line x1="34" y1="360" x2="220" y2="360" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>

  <rect x="34" y="373" width="186" height="82" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#53d8fb" stroke-opacity="0.55"/>
  <text x="127" y="395" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">the compiler sees the rank grow,</text>
  <text x="127" y="414" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">statically, across the program</text>
  <text x="127" y="437" fill="#53d8fb" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle" filter="url(#glowCyan)">EXPAND gets 2u</text>

  <!-- Use-site folding -->
  <rect x="244" y="74" width="456" height="403" rx="10" fill="url(#foldFill)" stroke="#e94560" stroke-width="1.5"/>
  <rect x="244" y="74" width="456" height="31" rx="9" fill="#e94560" fill-opacity="0.15"/>
  <text x="472" y="95" fill="#ff8b9e" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WHAT FOLDS AT THE USE SITE</text>

  <text x="361" y="120" fill="#ff8b8b" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">INTERPRETER</text>
  <text x="583" y="120" fill="#67f0a9" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SPECIALIZED</text>

  <!-- Literal trip count -->
  <rect x="256" y="130" width="210" height="83" rx="7" fill="#cc2222" fill-opacity="0.10" stroke="#cc2222" stroke-opacity="0.75"/>
  <rect x="478" y="130" width="210" height="83" rx="7" fill="#00cc66" fill-opacity="0.10" stroke="#00cc66" stroke-opacity="0.75"/>
  <text x="361" y="151" fill="#ff8b8b" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">RUNTIME RANK LOAD</text>
  <text x="583" y="151" fill="#67f0a9" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">LITERAL TRIP COUNT</text>
  <text x="262" y="177" fill="#ffffff" font-family="monospace" font-size="9">n = 1u &lt;&lt; (st-&gt;active_k - 1);</text>
  <text x="484" y="177" fill="#ffffff" font-family="monospace" font-size="9">n = 4u;  // literal trip count</text>
  <line x1="467" y1="172" x2="476" y2="172" stroke="#00cc66" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Folded sign -->
  <rect x="256" y="224" width="210" height="83" rx="7" fill="#cc2222" fill-opacity="0.10" stroke="#cc2222" stroke-opacity="0.75"/>
  <rect x="478" y="224" width="210" height="83" rx="7" fill="#00cc66" fill-opacity="0.10" stroke="#00cc66" stroke-opacity="0.75"/>
  <text x="361" y="245" fill="#ff8b8b" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DYNAMIC CONDITIONAL</text>
  <text x="583" y="245" fill="#67f0a9" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SIGN FOLDED</text>
  <text x="262" y="271" fill="#ffffff" font-family="monospace" font-size="9">im = dagger ? -w.im : w.im;</text>
  <text x="484" y="271" fill="#ffffff" font-family="monospace" font-size="9">im = -w.im;  // sign folded, ?: gone</text>
  <line x1="467" y1="266" x2="476" y2="266" stroke="#00cc66" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Constant displacement -->
  <rect x="256" y="318" width="210" height="83" rx="7" fill="#cc2222" fill-opacity="0.10" stroke="#cc2222" stroke-opacity="0.75"/>
  <rect x="478" y="318" width="210" height="83" rx="7" fill="#00cc66" fill-opacity="0.10" stroke="#00cc66" stroke-opacity="0.75"/>
  <text x="361" y="339" fill="#ff8b8b" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">INDEXED ADDRESS</text>
  <text x="583" y="339" fill="#67f0a9" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">CONSTANT DISPLACEMENT</text>
  <text x="262" y="365" fill="#ffffff" font-family="monospace" font-size="9">v[i + half]</text>
  <text x="484" y="365" fill="#ffffff" font-family="monospace" font-size="9">v[i + 4]  // constant displacement</text>
  <line x1="467" y1="360" x2="476" y2="360" stroke="#00cc66" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="256" y="414" width="432" height="42" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#e94560" stroke-opacity="0.55"/>
  <text x="327.6" y="432" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">the interpreter reloads</text><text x="427.1" y="432" fill="#dfe3ed" font-family="monospace" font-size="10">st-&gt;active_k</text><text x="505.1" y="432" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">at every instruction:</text>
  <text x="472" y="448" fill="#ff8b8b" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">any preceding op could have changed it</text>

  <!-- Scalar-load accounting -->
  <rect x="712" y="74" width="366" height="403" rx="10" fill="url(#ledgerFill)" stroke="#00cc66" stroke-width="1.5"/>
  <rect x="712" y="74" width="366" height="31" rx="9" fill="#00cc66" fill-opacity="0.14"/>
  <text x="895" y="95" fill="#67f0a9" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">s_load ACCOUNTING — 6 → 4</text>

  <rect x="724" y="116" width="342" height="262" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="724" y="116" width="342" height="28" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <line x1="924" y1="116" x2="924" y2="378" stroke="#ffffff" stroke-opacity="0.12"/>
  <line x1="988" y1="116" x2="988" y2="378" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#aeb4c7" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
    <text x="824" y="134">LOAD</text>
    <text x="956" y="134">INTERPRETER</text>
    <text x="1027" y="134">SPECIALIZED</text>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.08">
    <line x1="724" y1="144" x2="1066" y2="144"/>
    <line x1="724" y1="174" x2="1066" y2="174"/>
    <line x1="724" y1="204" x2="1066" y2="204"/>
    <line x1="724" y1="234" x2="1066" y2="234"/>
    <line x1="724" y1="270" x2="1066" y2="270"/>
    <line x1="724" y1="324" x2="1066" y2="324"/>
  </g>

  <g font-family="monospace" font-size="9.5">
    <text x="731" y="163" fill="#dfe3ed">0x20 — pc</text>
    <text x="731" y="193" fill="#dfe3ed">0x18 — instrs</text>
    <text x="731" y="223" fill="#dfe3ed">0x0 — kernarg block</text>
    <rect x="727" y="238" width="194" height="28" rx="4" fill="#53d8fb" fill-opacity="0.10" stroke="#53d8fb" stroke-opacity="0.55"/>
    <text x="731" y="257" fill="#8de7fc" font-weight="700">0x278 — st-&gt;active_k</text>
    <text x="731" y="290" fill="#dfe3ed">dynamically-indexed</text>
    <text x="731" y="307" fill="#dfe3ed">frame word (s10, s0)</text>
    <text x="731" y="344" fill="#dfe3ed">st-&gt;px / phase operands</text>
    <text x="731" y="361" fill="#dfe3ed">at fixed offsets</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="956" y="164" fill="#ff7777" font-family="DejaVu Sans">✓</text>
    <text x="1027" y="164" fill="#9ba3b8">—</text>
    <text x="956" y="194" fill="#ff7777" font-family="DejaVu Sans">✓</text>
    <text x="1027" y="194" fill="#9ba3b8">—</text>
    <text x="956" y="224" fill="#ff7777" font-family="DejaVu Sans">✓</text>
    <text x="1027" y="224" fill="#67f0a9" font-family="DejaVu Sans">✓</text>
    <text x="956" y="258" fill="#53d8fb" font-family="DejaVu Sans">✓</text>
    <text x="1027" y="258" fill="#9ba3b8">—</text>
    <text x="956" y="300" fill="#ff7777" font-family="DejaVu Sans">✓ ✓</text>
    <text x="1027" y="300" fill="#9ba3b8">—</text>
    <text x="956" y="354" fill="#9ba3b8">—</text>
    <text x="1027" y="354" fill="#67f0a9" font-family="DejaVu Sans">✓ ✓ ✓</text>
  </g>

  <rect x="724" y="384" width="342" height="43" rx="6" fill="#53d8fb" fill-opacity="0.10" stroke="#53d8fb" stroke-opacity="0.75"/>
  <text x="895" y="402" fill="#8de7fc" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">active_k: exactly one interpreter load</text>
  <text x="895" y="418" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">s_load_dword ..., 0x278 · specialized: none</text>

  <text x="730" y="439" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9"><tspan fill="#ffffff" font-weight="700">three</tspan> interpreter-only loads (pc, instrs, active_k) and <tspan fill="#ffffff" font-weight="700">both</tspan></text>
  <text x="730" y="451" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">dynamically-indexed frame reads disappear; <tspan fill="#ffffff" font-weight="700">three</tspan> statically-addressed</text>
  <text x="730" y="463" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">loads appear. Net <tspan fill="#67f0a9" font-weight="700">6→4</tspan> — but every surviving load now has a</text>
  <text x="730" y="475" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="700">compile-time address.</text>

  <!-- Punchline -->
  <rect x="22" y="500" width="1056" height="106" rx="10" fill="#e94560" fill-opacity="0.13" stroke="#e94560" stroke-width="1"/>
  <text x="550" y="521" fill="#ff8b9e" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.7">KNOWN BOUND, NOT UNROLLED CODE</text>
  <text x="387.7" y="542" fill="#ffffff" font-family="Arial, sans-serif" font-size="11.5">What it does not buy: the loop is still there. At rank 8 with</text><text x="682.6" y="542" fill="#ffffff" font-family="monospace" font-size="11.5">V2_STRIDE = 256</text><text x="787.6" y="542" fill="#ffffff" font-family="Arial, sans-serif" font-size="11.5">,</text>
  <text x="550" y="560" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11.5" text-anchor="middle">that is a handful of iterations; at rank 22, thousands. V1 tried to emit those iterations as code</text>
  <text x="550" y="578" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11.5" text-anchor="middle">and produced 20 MB of IR that took 221 s to compile. V2 emits one loop with a known bound —</text>
  <text x="550" y="596" fill="#ffffff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">which is what LLVM's loop optimizer actually wants.</text>
</svg>
