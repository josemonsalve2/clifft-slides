<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">Source Lines per Bytecode Instruction</title>
  <desc id="desc">Log-scale comparison of emitted source density. V1 has two small-circuit preamble-amortization points, an anomalous qv10 result, and a flat long-circuit band. Hybrid remains near eighteen lines per instruction, while V2 converges to one line per instruction.</desc>

  <defs>
    <linearGradient id="v1Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc2222" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="hybridFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8800" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff8800" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="v2Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53d8fb" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#53d8fb" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc2222"/>
    </marker>
  </defs>

  <rect width="1100" height="590" fill="#1a1a2e"/>
  <path d="M0 67 H1100 M0 516 H1100" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M58 0 V516 M1054 0 V516" stroke="#ffffff" stroke-opacity="0.025"/>

  <!-- Title -->
  <text x="550" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Source Lines per Bytecode Instruction</text>
  <text x="550" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">log scale · lower is better · V2 converges to 1.00</text>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="10.5">
    <rect x="822" y="76" width="232" height="34" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="842" cy="93" r="5" fill="#cc2222"/>
    <text x="854" y="97" fill="#dfe3ed">V1</text>
    <circle cx="900" cy="93" r="5" fill="#ff8800"/>
    <text x="912" y="97" fill="#dfe3ed">Hybrid</text>
    <circle cx="984" cy="93" r="5" fill="#53d8fb"/>
    <text x="996" y="97" fill="#dfe3ed">V2</text>
  </g>

  <!-- Plot frame and log axis -->
  <rect x="92" y="78" width="962" height="372" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="27" y="265" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 27 265)">LINES / INSTRUCTION · LOG SCALE</text>

  <g font-family="monospace" font-size="9.5" text-anchor="end">
    <line x1="84" y1="425" x2="1054" y2="425" stroke="#53d8fb" stroke-width="1.5" stroke-opacity="0.72"/>
    <text x="79" y="429" fill="#53d8fb" font-weight="700">1.00</text>

    <line x1="92" y1="306" x2="1054" y2="306" stroke="#ff8800" stroke-width="1.2" stroke-dasharray="5 5" stroke-opacity="0.70"/>
    <text x="79" y="310" fill="#ffb35c" font-weight="700">~18</text>

    <line x1="92" y1="260" x2="1054" y2="260" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="79" y="264" fill="#9ba3b8">55</text>

    <line x1="92" y1="250" x2="1054" y2="250" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="79" y="254" fill="#9ba3b8">69</text>

    <line x1="92" y1="226" x2="1054" y2="226" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="79" y="230" fill="#9ba3b8">125.8</text>

    <line x1="92" y1="200" x2="1054" y2="200" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="79" y="204" fill="#9ba3b8">236.8</text>
  </g>

  <!-- Circuit-size regions -->
  <line x1="362" y1="78" x2="362" y2="450" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4 5"/>
  <line x1="650" y1="78" x2="650" y2="450" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4 5"/>
  <rect x="650" y="78" width="404" height="372" fill="#cc2222" fill-opacity="0.045"/>

  <!-- Hybrid constant -->
  <rect x="112" y="299" width="922" height="14" rx="7" fill="url(#hybridFill)" stroke="#ff8800" stroke-opacity="0.75"/>
  <rect x="882" y="282" width="152" height="18" rx="9" fill="#0d0d1a" stroke="#ff8800" stroke-opacity="0.50"/>
  <text x="958" y="295" fill="#ffb35c" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Hybrid · constant ~18</text>

  <!-- V2 convergence -->
  <path d="M174 382 C314 397 404 411 520 417 S842 424 1026 425" fill="none" stroke="#53d8fb" stroke-width="2.5" stroke-linecap="round" filter="url(#glowCyan)"/>
  <circle cx="1026" cy="425" r="5" fill="#53d8fb"/>
  <rect x="694" y="400" width="332" height="20" rx="10" fill="#0d0d1a" stroke="#53d8fb" stroke-opacity="0.60"/>
  <text x="860" y="414" fill="#8ee9ff" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">V2 — one line of C per bytecode instruction</text>

  <!-- Small-circuit V1 points -->
  <g>
    <circle cx="202" cy="200" r="8" fill="#cc2222" stroke="#ff7777" stroke-width="1.5"/>
    <circle cx="278" cy="226" r="8" fill="#cc2222" stroke="#ff7777" stroke-width="1.5"/>
    <text x="202" y="184" fill="#ff8e8e" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">236.8*</text>
    <text x="278" y="247" fill="#ff8e8e" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">125.8*</text>
    <rect x="108" y="337" width="250" height="38" rx="7" fill="#0d0d1a" fill-opacity="0.90" stroke="#53d8fb" stroke-opacity="0.55"/>
    <text x="232" y="352" fill="#8ee9ff" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">* fixed preamble amortized</text>
    <text x="232" y="367" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">over few instructions · not a U2/U4 effect</text>
  </g>

  <!-- qv10 anomaly -->
  <g>
    <rect x="432" y="104" width="42" height="321" rx="7" fill="url(#v1Fill)" stroke="#cc2222" stroke-width="2"/>
    <rect x="504" y="414" width="42" height="11" rx="5.5" fill="url(#v2Fill)" stroke="#53d8fb" stroke-width="2"/>

    <rect x="370" y="119" width="298" height="42" rx="7" fill="#0d0d1a" stroke="#cc2222" stroke-opacity="0.82"/>
    <text x="519" y="136" fill="#ff8e8e" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">336,988 lines from 140 instructions</text>
    <text x="519" y="151" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">anomalous by a factor of 35 against its neighbours</text>
    <path d="M442 161 L452 104" fill="none" stroke="#cc2222" stroke-width="1.5" marker-end="url(#arrowRed)"/>

    <rect x="482" y="365" width="160" height="24" rx="12" fill="#0d0d1a" stroke="#53d8fb" stroke-opacity="0.78"/>
    <text x="562" y="381" fill="#8ee9ff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">179 lines · 1,883×</text>
    <path d="M542 389 L526 414" fill="none" stroke="#53d8fb" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- Long-circuit V1 band -->
  <g>
    <rect x="686" y="250" width="324" height="10" rx="5" fill="#cc2222" fill-opacity="0.42" stroke="#cc2222" stroke-width="1.5"/>
    <circle cx="730" cy="256" r="5" fill="#ff6666"/>
    <circle cx="840" cy="253" r="5" fill="#ff6666"/>
    <circle cx="970" cy="258" r="5" fill="#ff6666"/>
    <rect x="724" y="122" width="310" height="58" rx="8" fill="#0d0d1a" fill-opacity="0.92" stroke="#cc2222" stroke-opacity="0.72"/>
    <text x="879" y="140" fill="#ff8e8e" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1,720 → 4,296 instructions</text>
    <text x="879" y="156" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">55–69 lines/instr — flat</text>
    <text x="879" y="171" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">the bloat is per-instruction, not per-circuit</text>
    <path d="M879 180 L879 247" fill="none" stroke="#cc2222" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  </g>

  <!-- X-axis labels -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="227" y="470" fill="#ffffff" font-size="11.5" font-weight="700">Small circuits*</text>
    <text x="506" y="470" fill="#ffffff" font-size="11.5" font-weight="700">qv10 anomaly</text>
    <text x="852" y="470" fill="#ffffff" font-size="11.5" font-weight="700">Longest circuits</text>
    <text x="227" y="488" fill="#9ba3b8" font-size="9.5">fixed preamble dominates</text>
    <text x="506" y="488" fill="#9ba3b8" font-size="9.5">opcode-mix outlier</text>
    <text x="852" y="488" fill="#9ba3b8" font-size="9.5">V1 density stays flat</text>
    <text x="573" y="508" fill="#aeb4c7" font-size="10" font-weight="700">CIRCUIT-SIZE CLASS</text>
  </g>

  <!-- Punchline -->
  <rect x="24" y="529" width="1052" height="42" rx="10" fill="#e94560" fill-opacity="0.13" stroke="#e94560"/>
  <text x="550" y="554" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">A 387-instruction QV circuit could fail to compile while a 4,296-instruction surface circuit succeeded. Length was never the variable — opcode mix was.</text>
</svg>
