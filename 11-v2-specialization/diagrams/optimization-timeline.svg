  <rect x="260" y="84" width="265" height="62" rx="7" fill="#0d0d1a" fill-opacity="0.94" stroke="#53d8fb" stroke-opacity="0.65"/>
  <text x="274" y="99" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">the kernel trace names</text>
  <text x="377" y="99" fill="#dfe3ed" font-family="monospace" font-size="9">clifft_v2_global</text>
  <text x="469" y="99" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">here —</text>
  <text x="274" y="112" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">the specializer had not reached this tier.</text>
  <text x="274" y="125" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">Every movement in this chart is a change of</text>
  <text x="274" y="138" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="700">which kernel ran, not a tuning effect.</text>
