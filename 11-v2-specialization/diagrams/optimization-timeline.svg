  <g fill="#ffb35c" stroke="#1a1a2e" stroke-width="1">
    <circle cx="80" cy="193.3" r="2.8"/><circle cx="240" cy="197.8" r="2.8"/><circle cx="400" cy="189.7" r="2.8"/>
