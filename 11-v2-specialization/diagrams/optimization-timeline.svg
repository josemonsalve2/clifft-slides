  <g fill="#ff7777" stroke="#1a1a2e" stroke-width="1">
    <circle cx="80" cy="216.1" r="2.8"/><circle cx="240" cy="220.0" r="2.8"/><circle cx="400" cy="213.3" r="2.8"/>
    <circle cx="560" cy="213.3" r="2.8"/><circle cx="720" cy="213.3" r="2.8"/><circle cx="880" cy="268.6" r="2.8"/><circle cx="1040" cy="269.0" r="2.8"/>
