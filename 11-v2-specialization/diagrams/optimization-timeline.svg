  <path d="M0 60 H1100 M0 414 H1100 M0 536 H1100 M0 576 H1100" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M20 0 V620 M1080 0 V620" stroke="#ffffff" stroke-opacity="0.025"/>

  <!-- Title -->
