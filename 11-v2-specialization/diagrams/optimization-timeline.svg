<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Each Tier's Win Arrives in Exactly One Step</title>
  <desc id="desc">Log-scale line chart of V2 to SVM kernel-time ratios across optimization stages, with tier landing points, a measurement-artifact explanation, trace evidence, and a node-change caveat.</desc>

  <defs>
    <linearGradient id="artifactFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53d8fb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#53d8fb" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="punchlineFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#e94560" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowOrange" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
  </defs>

