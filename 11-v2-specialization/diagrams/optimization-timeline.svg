  </g>

  <!-- One-step callouts -->
  <rect x="125" y="303" width="230" height="40" rx="7" fill="#00cc66" fill-opacity="0.12" stroke="#00cc66"/>
  <text x="240" y="319" fill="#8ff7bf" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">register tier lands here —</text>
  <text x="240" y="335" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">28.258 → 1.215</text>

  <rect x="290" y="350" width="230" height="40" rx="7" fill="#ff8800" fill-opacity="0.12" stroke="#ff8800"/>
  <text x="405" y="366" fill="#ffb35c" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">coop tier lands here — qv10</text>
  <text x="405" y="382" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">1.237 → 0.252</text>

  <rect x="585" y="303" width="270" height="40" rx="7" fill="#ff8800" fill-opacity="0.12" stroke="#ff8800"/>
  <text x="720" y="319" fill="#ffb35c" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">noise-heavy coop lands here —</text>
  <text x="720" y="335" fill="#ffffff" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">surface_d7_t15 1.427 → 0.503</text>

  <rect x="755" y="350" width="250" height="40" rx="7" fill="#cc2222" fill-opacity="0.14" stroke="#cc2222"/>
  <text x="880" y="366" fill="#ff7777" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">global tier lands here —</text>
  <text x="880" y="382" fill="#ffffff" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">surface_d9_t19 0.972 → 0.262</text>

  <!-- Artifact explanation -->
  <rect x="20" y="420" width="650" height="112" rx="8" fill="#0d0d1a" fill-opacity="0.86" stroke="#53d8fb" stroke-opacity="0.65"/>
  <text x="34" y="439" fill="#53d8fb" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">MEASUREMENT ARTIFACT, shown not dropped.</text>
  <text x="34" y="455" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.3">At `9d9cc68` the gate's verdict was cached only in-process. `rocprofv3` spawns a fresh process per invocation,</text>
  <text x="34" y="468" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.3">so the gate's own validation dispatches re-ran inside the profiled region and the digester summed them.</text>
  <text x="34" y="481" fill="#ffffff" font-family="Arial, sans-serif" font-size="9.3" font-weight="700">The kernel trace shows three dispatches where every other run has one.</text>
  <text x="34" y="494" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.3">`bbb5e42` persisted the verdict to `&lt;hsaco&gt;.gate` and the numbers returned to trend.</text>
  <text x="34" y="507" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.3">Nothing had slowed down.</text>

  <!-- Trace evidence -->
  <rect x="680" y="420" width="400" height="112" rx="8" fill="#0d0d1a" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="694" y="438" fill="#9ba3b8" font-family="monospace" font-size="9" font-weight="700">TRACE EVIDENCE</text>
  <g fill="#dfe3ed" font-family="monospace" font-size="9">
    <text x="694" y="451">noise-fenced-gated  frame_h  clifft_v2_register x1 (19.1us)</text>
    <text x="694" y="462">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;+ clifft_v2_spec x2 (28.8us)</text>
    <text x="694" y="473">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;qv10     clifft_v2_coop x1 (1270.2us)</text>
    <text x="694" y="484">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;+ clifft_v2_spec x2 (1667.2us)</text>
    <text x="694" y="495">noise-specialized   frame_h  clifft_v2_spec x1 (10.5us)</text>
    <text x="694" y="506">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;qv10     clifft_v2_spec x1 (1340.0us)</text>
  </g>

  <!-- Node caveat -->
  <text x="20" y="551" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5">Columns 1–8 of the archive ran on `smci350-rck-g03-d13-21`; columns 9–12, including final, ran on `smci350-rck-g03-f13-21`.</text>
  <text x="20" y="566" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5">Every cell is a V2/SVM ratio with both halves in the same job, so the comparison survives — but the step between those two columns carries a node change as well as a code change.</text>

  <!-- Punchline -->
  <rect x="20" y="580" width="1060" height="28" rx="8" fill="url(#punchlineFill)" stroke="#e94560"/>
  <text x="550" y="599" fill="#ffffff" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Structural changes, not tuning: each tier is flat until the one commit that addresses it, then flat again.</text>
</svg>
