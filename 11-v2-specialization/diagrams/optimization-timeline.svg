  <g font-family="monospace" font-size="9.5" fill="#dfe3ed">
    <line x1="665" y1="110" x2="691" y2="110" stroke="#00cc66" stroke-width="2.4"/><text x="699" y="113">frame_h</text>
    <line x1="665" y1="127" x2="691" y2="127" stroke="#00cc66" stroke-width="2" stroke-dasharray="8 5"/><text x="699" y="130">circuit_d3_p0.001</text>
    <line x1="665" y1="144" x2="691" y2="144" stroke="#ff8800" stroke-width="2.4"/><text x="699" y="147">qv10</text>
    <line x1="665" y1="161" x2="691" y2="161" stroke="#ff8800" stroke-width="2" stroke-dasharray="8 5"/><text x="699" y="164">surface_d7_t15</text>
    <line x1="855" y1="110" x2="881" y2="110" stroke="#ffb35c" stroke-width="1.8" stroke-dasharray="2 5"/><text x="889" y="113">surface_d9_t10</text>
    <line x1="855" y1="127" x2="881" y2="127" stroke="#cc2222" stroke-width="2.4"/><text x="889" y="130">surface_d7_t19</text>
    <line x1="855" y1="144" x2="881" y2="144" stroke="#cc2222" stroke-width="2" stroke-dasharray="8 5"/><text x="889" y="147">surface_d9_t19</text>
    <line x1="855" y1="161" x2="881" y2="161" stroke="#ff7777" stroke-width="1.8" stroke-dasharray="2 5"/><text x="889" y="164">surface_d11_t15</text>
  </g>

  <!-- Optimization stages -->
  <g fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <text x="80" y="291">baseline</text>
    <text x="240" y="291">after P0+P1</text>
    <text x="400" y="291">after specializer</text>
    <text x="560" y="291">fenced+gated*</text>
    <text x="720" y="291">noise-specialized</text>
    <text x="880" y="291">global-specialized</text>
    <text x="1040" y="291">final</text>
  </g>
  <g stroke="#dfe3ed" stroke-opacity="0.65">
    <line x1="80" y1="270" x2="80" y2="277"/><line x1="240" y1="270" x2="240" y2="277"/>
    <line x1="400" y1="270" x2="400" y2="277"/><line x1="560" y1="270" x2="560" y2="277"/>
    <line x1="720" y1="270" x2="720" y2="277"/><line x1="880" y1="270" x2="880" y2="277"/>
