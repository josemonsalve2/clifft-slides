<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="620" viewBox="0 0 1060 620" role="img" aria-labelledby="title desc">
  <title id="title">V1's MLIR — Intended vs Actual</title>
  <desc id="desc">A ghosted intended dialect-lowering ladder is contrasted with V1's actual direct LLVM-dialect emission, two cleanup passes, and a provable no-op pass.</desc>

  <defs>
    <linearGradient id="ghostFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeb4c7" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#aeb4c7" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="actualFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc2222" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="cleanupFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8800" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff8800" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGhost" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#aeb4c7"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8800"/>
    </marker>
  </defs>

  <rect width="1060" height="620" fill="#1a1a2e"/>
  <path d="M0 65 H1060 M0 551 H1060" stroke="#ffffff" stroke-opacity="0.07"/>
  <path d="M405 74 V540" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="4 6"/>

  <!-- Title -->
  <text x="530" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">V1's MLIR — Intended vs Actual</text>
  <text x="530" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">the middle of the lowering pipeline was never built</text>

  <!-- Intended column -->
  <g opacity="0.52">
    <text x="205" y="86" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">INTENDED</text>
    <text x="205" y="102" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">progressive dialect lowering</text>

    <rect x="70" y="116" width="270" height="38" rx="7" fill="url(#ghostFill)" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="205" y="140" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">clifft dialect</text>
    <line x1="205" y1="154" x2="205" y2="173" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGhost)"/>
    <text x="219" y="169" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">custom lowering passes</text>

    <rect x="70" y="177" width="270" height="38" rx="7" fill="url(#ghostFill)" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="205" y="201" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">linalg / affine</text>
    <line x1="205" y1="215" x2="205" y2="234" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGhost)"/>
    <text x="219" y="230" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">custom lowering passes</text>

    <rect x="70" y="238" width="270" height="38" rx="7" fill="url(#ghostFill)" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="205" y="262" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">scf</text>
    <line x1="205" y1="276" x2="205" y2="295" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGhost)"/>
    <text x="219" y="291" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">custom lowering passes</text>

    <rect x="70" y="299" width="270" height="38" rx="7" fill="url(#ghostFill)" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="205" y="323" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">gpu</text>
    <line x1="205" y1="337" x2="205" y2="356" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGhost)"/>
    <text x="219" y="352" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">custom lowering passes</text>

    <rect x="70" y="360" width="270" height="38" rx="7" fill="url(#ghostFill)" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="205" y="384" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">llvm</text>
    <line x1="205" y1="398" x2="205" y2="417" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGhost)"/>
    <text x="219" y="413" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">custom lowering passes</text>

    <rect x="70" y="421" width="270" height="38" rx="7" fill="url(#ghostFill)" stroke="#aeb4c7" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="205" y="445" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">AMDGCN ISA</text>
  </g>

  <!-- Never-built stamp -->
  <g>
    <rect x="78" y="181" width="34" height="152" rx="5" fill="#1a1a2e" fill-opacity="0.90" stroke="#cc2222" stroke-width="2.5"/>
    <text x="95" y="257" fill="#ff5555" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" text-anchor="middle" transform="rotate(-90 95 257)" filter="url(#glowRed)">NEVER BUILT</text>
  </g>

  <!-- Reality transition -->
  <line x1="370" y1="286" x2="432" y2="286" stroke="#53d8fb" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="371" y="256" width="60" height="20" rx="10" fill="#0d0d1a" stroke="#53d8fb" stroke-opacity="0.75"/>
  <text x="401" y="270" fill="#53d8fb" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">REALITY</text>

  <!-- Actual column header and direct emission -->
  <text x="735" y="86" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ACTUAL</text>
  <text x="735" y="102" fill="#ff7777" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">direct emission, then stock cleanup</text>

  <rect x="438" y="113" width="132" height="42" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-width="1.5"/>
  <text x="504" y="139" fill="#ffffff" font-family="monospace" font-size="12.5" font-weight="700" text-anchor="middle">mlir_emit.cc</text>
  <line x1="570" y1="134" x2="606" y2="134" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="613" y="109" width="254" height="50" rx="8" fill="url(#actualFill)" stroke="#cc2222" stroke-width="2"/>
  <text x="740" y="130" fill="#ff7777" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">llvm dialect</text>
  <text x="740" y="148" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">emitted directly</text>
  <line x1="867" y1="134" x2="1008" y2="134" stroke="#cc2222" stroke-width="2"/>
  <path d="M1008 134 V173 H992" fill="none" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Stock passes -->
  <text x="447" y="177" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8">THREE STOCK PASSES</text>

  <rect x="438" y="188" width="570" height="62" rx="8" fill="url(#cleanupFill)" stroke="#ff8800" stroke-width="1.5"/>
  <text x="454" y="209" fill="#ffb35c" font-family="monospace" font-size="13" font-weight="700">canonicalize</text>
  <rect x="858" y="197" width="134" height="23" rx="11.5" fill="#ff8800" fill-opacity="0.16" stroke="#ff8800"/>
  <text x="925" y="213" fill="#ffb35c" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">947 → 736 lines</text>
  <text x="454" y="235" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">constant dedup: <tspan font-family="monospace">llvm.mlir.constant</tspan> 240 → 59</text>

  <line x1="723" y1="250" x2="723" y2="261" stroke="#ff8800" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <rect x="438" y="265" width="570" height="62" rx="8" fill="url(#cleanupFill)" stroke="#ff8800" stroke-width="1.5"/>
  <text x="454" y="286" fill="#ffb35c" font-family="monospace" font-size="13" font-weight="700">cse</text>
  <rect x="858" y="274" width="134" height="23" rx="11.5" fill="#ff8800" fill-opacity="0.16" stroke="#ff8800"/>
  <text x="925" y="290" fill="#ffb35c" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">736 → 608 lines</text>
  <text x="454" y="312" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">redundant <tspan font-family="monospace">shl</tspan>/<tspan font-family="monospace">and</tspan>/<tspan font-family="monospace">xor</tspan> elimination</text>

  <line x1="723" y1="327" x2="723" y2="338" stroke="#cc2222" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="438" y="342" width="570" height="69" rx="8" fill="url(#actualFill)" stroke="#cc2222" stroke-width="2"/>
  <text x="454" y="363" fill="#ff7777" font-family="monospace" font-size="13" font-weight="700">convert-func-to-llvm</text>
  <rect x="842" y="350" width="150" height="24" rx="12" fill="#cc2222" fill-opacity="0.30" stroke="#ff5555"/>
  <text x="917" y="367" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">PROVABLE NO-OP</text>
  <text x="454" y="391" fill="#ffffff" font-family="monospace" font-size="11.5" font-weight="700">608 → 608 lines</text>
  <text x="590" y="391" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">no <tspan font-family="monospace">func</tspan> dialect to convert — the emitter never produced any</text>

  <!-- Actual back end -->
  <line x1="723" y1="411" x2="723" y2="425" stroke="#53d8fb" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="438" y="429" width="172" height="35" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#53d8fb" stroke-opacity="0.75"/>
  <text x="524" y="451" fill="#ffffff" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">mlir-translate</text>
  <line x1="610" y1="446.5" x2="646" y2="446.5" stroke="#53d8fb" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="653" y="429" width="112" height="35" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#53d8fb" stroke-opacity="0.75"/>
  <text x="709" y="451" fill="#ffffff" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">LLVM IR</text>
  <line x1="765" y1="446.5" x2="801" y2="446.5" stroke="#53d8fb" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="808" y="429" width="200" height="35" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#53d8fb" stroke-opacity="0.75"/>
  <text x="908" y="451" fill="#ffffff" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">AMDGCN ISA</text>

  <!-- No-op diff inset -->
  <rect x="438" y="477" width="570" height="65" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.85"/>
  <text x="452" y="496" fill="#ff6666" font-family="monospace" font-size="9.5">- // -----// IR Dump After CSE (cse) //----- //</text>
  <text x="452" y="514" fill="#00ff80" font-family="monospace" font-size="9.5">+ // -----// IR Dump After ConvertFuncToLLVMPass (convert-func-to-llvm) //----- //</text>
  <text x="994" y="534" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="end">the entire diff · 608 → 608 lines</text>

  <!-- Punchline -->
  <rect x="30" y="562" width="1000" height="43" rx="9" fill="#e94560" fill-opacity="0.14" stroke="#e94560"/>
  <text x="530" y="588.5" fill="#ffffff" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Two passes of cleanup after a sloppy emitter, and one that does nothing. This is not compilation — it is recovery.</text>
</svg>
