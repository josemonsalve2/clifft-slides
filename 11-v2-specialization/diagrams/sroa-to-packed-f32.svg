<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Registers, Then Packing</title>
  <desc id="desc">A four-stage transformation from stack-resident amplitudes at clang O0 through SROA, inlining, and SLP vectorization to register-resident IR and packed floating-point instructions at clang O2.</desc>

  <defs>
    <linearGradient id="redPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc2222" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00cc66" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00cc66" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cyanBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53d8fb" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#53d8fb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#53d8fb" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8800"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#1a1a2e"/>
  <path d="M0 64 H1100 M0 550 H1100" stroke="#ffffff" stroke-opacity="0.07"/>
  <path d="M24 64 V550 M1076 64 V550" stroke="#ffffff" stroke-opacity="0.025"/>

  <text x="550" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Registers, Then Packing</text>
  <text x="550" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Why fmul rising from 12 to 448 is the good news</text>

  <!-- Stage 1: clangO0.ll -->
  <rect x="24" y="78" width="220" height="452" rx="10" fill="url(#redPanel)" stroke="#cc2222" stroke-width="2"/>
  <rect x="24" y="78" width="220" height="38" rx="9" fill="#cc2222" fill-opacity="0.25"/>
  <text x="134" y="102" fill="#ff8e8e" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">-O0 · every local on the stack</text>

  <!-- Stack-slot pile -->
  <rect x="52" y="143" width="150" height="88" rx="6" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.38"/>
  <rect x="46" y="137" width="150" height="88" rx="6" fill="#0d0d1a" fill-opacity="0.82" stroke="#cc2222" stroke-opacity="0.58"/>
  <rect x="40" y="131" width="150" height="88" rx="6" fill="#0d0d1a" fill-opacity="0.94" stroke="#cc2222" stroke-width="1.5"/>
  <text x="115" y="154" fill="#ff8e8e" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">addrspace(5)</text>
  <rect x="55" y="165" width="120" height="36" rx="4" fill="#cc2222" fill-opacity="0.16" stroke="#cc2222" stroke-opacity="0.75"/>
  <text x="115" y="188" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">amplitude array</text>
  <path d="M175 183 H225" fill="none" stroke="#ff8800" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="199" y="174" fill="#ffb35c" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">escaped</text>
  <text x="199" y="213" fill="#ffb35c" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">address</text>

  <!-- O0 census -->
  <text x="40" y="260" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700">IR census</text>
  <text x="40" y="278" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700">OP</text>
  <text x="227" y="278" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="end">COUNT</text>
  <line x1="40" y1="284" x2="228" y2="284" stroke="#ffffff" stroke-opacity="0.10"/>
  <g font-family="monospace" font-size="11">
    <text x="40" y="305" fill="#dfe3ed">load</text>
    <text x="227" y="305" fill="#ffffff" text-anchor="end">4,898</text>
    <text x="40" y="331" fill="#dfe3ed">store</text>
    <text x="227" y="331" fill="#ffffff" text-anchor="end">2,488</text>
    <text x="40" y="357" fill="#dfe3ed">alloca</text>
    <text x="227" y="357" fill="#ffffff" text-anchor="end">2,271</text>
    <text x="40" y="383" fill="#dfe3ed">addrspacecast</text>
    <text x="227" y="383" fill="#ffffff" text-anchor="end">2,262</text>
    <text x="40" y="409" fill="#dfe3ed">call</text>
    <text x="227" y="409" fill="#ffffff" text-anchor="end">1,770</text>
  </g>
  <rect x="40" y="435" width="188" height="52" rx="6" fill="#cc2222" fill-opacity="0.14" stroke="#cc2222" stroke-opacity="0.65"/>
  <text x="134" y="457" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">clangO0.ll</text>
  <text x="134" y="478" fill="#ff7777" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">19,551 IR lines</text>

  <!-- Transition into passes -->
  <path d="M246 304 H260" fill="none" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="255" y="262" fill="#53d8fb" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90 255 262)">promote</text>

  <!-- Stage 2: pass band -->
  <rect x="264" y="120" width="170" height="348" rx="12" fill="url(#cyanBand)"/>
  <line x1="264" y1="120" x2="434" y2="120" stroke="#53d8fb" stroke-width="2"/>
  <line x1="264" y1="468" x2="434" y2="468" stroke="#53d8fb" stroke-width="2"/>
  <text x="349" y="102" fill="#53d8fb" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">optimization passes</text>

  <rect x="279" y="158" width="140" height="48" rx="24" fill="#0d0d1a" fill-opacity="0.90" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="349" y="187" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SROA / mem2reg</text>
  <path d="M349 210 V244" fill="none" stroke="#53d8fb" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <rect x="279" y="250" width="140" height="48" rx="24" fill="#0d0d1a" fill-opacity="0.90" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="349" y="279" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">inlining</text>
  <path d="M349 302 V336" fill="none" stroke="#53d8fb" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <rect x="279" y="342" width="140" height="48" rx="24" fill="#0d0d1a" fill-opacity="0.90" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="349" y="371" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SLP vectorizer</text>

  <text x="349" y="421" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">static amplitude indices</text>
  <text x="349" y="439" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">keep addresses local</text>

  <!-- Transition into O2 -->
  <path d="M436 304 H450" fill="none" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="445" y="262" fill="#53d8fb" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90 445 262)">registers</text>

  <!-- Stage 3: clangO2.ll -->
  <rect x="454" y="78" width="382" height="452" rx="10" fill="url(#greenPanel)" stroke="#00cc66" stroke-width="2"/>
  <rect x="454" y="78" width="382" height="38" rx="9" fill="#00cc66" fill-opacity="0.22"/>
  <text x="645" y="102" fill="#8ff7bf" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">-O2 · the state is in registers</text>

  <!-- O2 census -->
  <text x="470" y="140" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700">IR census · -O0 → -O2</text>
  <text x="470" y="158" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700">OP</text>
  <text x="650" y="158" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="end">CHANGE</text>
  <line x1="470" y1="164" x2="650" y2="164" stroke="#ffffff" stroke-opacity="0.10"/>
  <g font-family="monospace" font-size="10.5">
    <text x="470" y="185" fill="#dfe3ed">alloca</text>
    <text x="650" y="185" fill="#00ff80" font-weight="700" text-anchor="end">2,271 → 3</text>
    <text x="470" y="211" fill="#dfe3ed">addrspacecast</text>
    <text x="650" y="211" fill="#00ff80" font-weight="700" text-anchor="end">2,262 → 8</text>
    <text x="470" y="237" fill="#dfe3ed">call</text>
    <text x="650" y="237" fill="#00ff80" font-weight="700" text-anchor="end">1,770 → 72</text>
    <text x="470" y="263" fill="#dfe3ed">load</text>
    <text x="650" y="263" fill="#00ff80" font-weight="700" text-anchor="end">4,898 → 1,014</text>
    <text x="470" y="289" fill="#dfe3ed">store</text>
    <text x="650" y="289" fill="#00ff80" font-weight="700" text-anchor="end">2,488 → 1,103</text>
    <text x="470" y="315" fill="#dfe3ed">fmul</text>
    <text x="650" y="315" fill="#53d8fb" font-weight="700" text-anchor="end">12 → 448</text>
    <text x="470" y="341" fill="#dfe3ed">shufflevector</text>
    <text x="650" y="341" fill="#53d8fb" font-weight="700" text-anchor="end">0 → 459</text>
  </g>

  <!-- Surviving alloca callout -->
  <path d="M654 181 H672" fill="none" stroke="#ff8800" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <rect x="672" y="145" width="148" height="122" rx="7" fill="#ff8800" fill-opacity="0.12" stroke="#ff8800"/>
  <text x="686" y="166" fill="#ffb35c" font-family="Arial, sans-serif" font-size="11" font-weight="700">three survive</text>
  <text x="686" y="185" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">aggregates with</text>
  <text x="686" y="200" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">escaping addresses</text>
  <text x="686" y="218" fill="#ffb35c" font-family="monospace" font-size="10" font-weight="700">private=336 scratch</text>
  <text x="681" y="237" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="700">alloca did not reach zero</text>
  <text x="686" y="253" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">2,271 grew; 3 does not</text>
  <g fill="#0d0d1a" stroke="#ff8800">
    <rect x="798" y="151" width="12" height="10" rx="2"/>
    <rect x="798" y="174" width="12" height="10" rx="2"/>
    <rect x="798" y="197" width="12" height="10" rx="2"/>
  </g>

  <!-- Surviving call callout -->
  <path d="M654 233 H662 V290 H672" fill="none" stroke="#53d8fb" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="672" y="277" width="148" height="76" rx="7" fill="#53d8fb" fill-opacity="0.08" stroke="#53d8fb" stroke-opacity="0.75"/>
  <text x="686" y="298" fill="#53d8fb" font-family="Arial, sans-serif" font-size="10" font-weight="700">72 survivors</text>
  <text x="686" y="316" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">noinline noise ops from</text>
  <text x="686" y="332" fill="#ffffff" font-family="monospace" font-size="9">V2_NOISE_ATTR</text>
  <text x="686" y="347" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">plus ocml calls</text>

  <!-- Register state and O2 line count -->
  <rect x="470" y="371" width="350" height="72" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#00cc66" stroke-opacity="0.65"/>
  <text x="485" y="392" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700">AMPLITUDES PROMOTED TO REGISTERS</text>
  <g fill="#00cc66" fill-opacity="0.16" stroke="#00cc66">
    <rect x="486" y="405" width="43" height="23" rx="4"/>
    <rect x="539" y="405" width="43" height="23" rx="4"/>
    <rect x="592" y="405" width="43" height="23" rx="4"/>
    <rect x="645" y="405" width="43" height="23" rx="4"/>
    <rect x="698" y="405" width="43" height="23" rx="4"/>
    <rect x="751" y="405" width="43" height="23" rx="4"/>
  </g>
  <rect x="470" y="458" width="350" height="48" rx="6" fill="#00cc66" fill-opacity="0.12" stroke="#00cc66" stroke-opacity="0.65"/>
  <text x="645" y="477" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">clangO2.ll</text>
  <text x="645" y="497" fill="#00ff80" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">8,132 IR lines</text>

  <!-- Transition into ISA -->
  <path d="M838 304 H852" fill="none" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="847" y="262" fill="#53d8fb" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90 847 262)">pack lanes</text>

  <!-- Stage 4: ISA payoff -->
  <rect x="856" y="78" width="220" height="452" rx="10" fill="url(#greenPanel)" stroke="#00cc66" stroke-width="2"/>
  <rect x="856" y="78" width="220" height="38" rx="9" fill="#00cc66" fill-opacity="0.22"/>
  <text x="966" y="102" fill="#8ff7bf" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ISA payoff</text>

  <!-- Packed instruction pills -->
  <rect x="872" y="137" width="188" height="53" rx="26.5" fill="#00cc66" fill-opacity="0.14" stroke="#00cc66" stroke-width="1.5"/>
  <text x="889" y="160" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">v_pk_add_f32</text>
  <text x="1045" y="160" fill="#00ff80" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">431</text>
  <rect x="889" y="170" width="28" height="10" fill="#53d8fb" fill-opacity="0.30" stroke="#53d8fb"/>
  <rect x="917" y="170" width="28" height="10" fill="#53d8fb" fill-opacity="0.14" stroke="#53d8fb"/>

  <rect x="872" y="202" width="188" height="53" rx="26.5" fill="#00cc66" fill-opacity="0.14" stroke="#00cc66" stroke-width="1.5"/>
  <text x="889" y="234" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">v_pk_mul_f32</text>
  <text x="1045" y="234" fill="#00ff80" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">416</text>

  <!-- V1 versus V2 comparison -->
  <text x="872" y="282" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9" font-weight="700">PACKED F32 INSTRUCTIONS</text>
  <text x="872" y="306" fill="#ff7777" font-family="monospace" font-size="10" font-weight="700">V1 v_pk_*_f32 = 0</text>
  <line x1="872" y1="316" x2="1058" y2="316" stroke="#ffffff" stroke-width="3" stroke-opacity="0.08"/>
  <circle cx="872" cy="316" r="4" fill="#cc2222"/>
  <text x="872" y="340" fill="#8ff7bf" font-family="monospace" font-size="10" font-weight="700">V2 = 847</text>
  <line x1="872" y1="350" x2="1058" y2="350" stroke="#ffffff" stroke-width="8" stroke-opacity="0.08"/>
  <line x1="872" y1="350" x2="1058" y2="350" stroke="#00cc66" stroke-width="8" filter="url(#glowGreen)"/>

  <!-- Lane arithmetic -->
  <rect x="872" y="376" width="188" height="112" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#53d8fb" stroke-opacity="0.62"/>
  <text x="966" y="399" fill="#53d8fb" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">lane arithmetic</text>
  <text x="886" y="424" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">V2 covers 1,705 f32 lanes</text>
  <text x="886" y="442" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">in 858 instructions</text>
  <text x="886" y="466" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">V1 needs 1,586 instructions</text>
  <text x="886" y="484" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">for 1,586 lanes</text>

  <!-- Mechanism sentence -->
  <line x1="264" y1="540" x2="836" y2="540" stroke="#53d8fb" stroke-opacity="0.70"/>
  <text x="550" y="537" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle">The amplitudes have statically-known indices, so their addresses do not escape.</text>

  <!-- Bottom strip -->
  <rect x="24" y="560" width="1052" height="48" rx="8" fill="#e94560" fill-opacity="0.13" stroke="#e94560"/>
  <text x="550" y="590" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">The real instruction-level win is packing, and it is 2× on the f32 path — not 23× on the f64 one.</text>
</svg>
