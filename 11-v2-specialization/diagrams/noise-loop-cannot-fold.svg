<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc">
  <title id="title">Constants the Specializer Cannot Use</title>
  <desc id="desc">The noise loop has literal range bounds after specialization, but its induction variable and trip count remain driven by the random stream and an ocml_log_f64 hazard draw.</desc>

  <defs>
    <linearGradient id="foldedFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00cc66" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00cc66" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="runtimeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc2222" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="costFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc2222"/>
    </marker>
  </defs>

  <rect width="1040" height="580" fill="#1a1a2e"/>
  <path d="M0 61 H1040 M0 312 H1040 M0 496 H1040" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M20 0 V554 M1020 0 V554" stroke="#ffffff" stroke-opacity="0.025"/>

  <text x="520" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Constants the Specializer Cannot Use</text>
  <text x="520" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">start and count fold to literals — but the loop is driven by the PRNG, not by the range</text>

  <!-- Left: specialized call and real loop body -->
  <g>
    <rect x="20" y="70" width="500" height="232" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.13"/>
    <rect x="20" y="70" width="500" height="30" rx="9" fill="#ffffff" fill-opacity="0.04"/>
    <text x="36" y="90" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700">THE OP · FOLDED GUARD, RANDOM INDUCTION</text>

    <rect x="35" y="108" width="470" height="47" rx="6" fill="url(#foldedFill)" stroke="#00cc66" stroke-opacity="0.72"/>
    <text x="45" y="125" fill="#dfe3ed" font-family="monospace" font-size="9">v2_op_noise_block(st, noise_sites, noise_channels,</text>
    <text x="45" y="143" fill="#dfe3ed" font-family="monospace" font-size="9">noise_hazards, num_noise_sites, </text>
    <text x="228.6" y="143" fill="#00ff80" font-family="monospace" font-size="9" font-weight="700" filter="url(#glowGreen)">131u</text>
    <text x="250.2" y="143" fill="#dfe3ed" font-family="monospace" font-size="9">, </text>
    <text x="261" y="143" fill="#00ff80" font-family="monospace" font-size="9" font-weight="700" filter="url(#glowGreen)">57u</text>
    <text x="277.2" y="143" fill="#dfe3ed" font-family="monospace" font-size="9">)</text>
    <text x="354" y="125" fill="#8ff7bf" font-family="monospace" font-size="9" font-weight="700">start → 131u</text>
    <text x="354" y="143" fill="#8ff7bf" font-family="monospace" font-size="9" font-weight="700">count → 57u</text>

    <rect x="35" y="164" width="470" height="126" rx="6" fill="#0d0d1a" stroke="#ffffff" stroke-opacity="0.10"/>

    <!-- Folded guard highlights -->
    <rect x="96.2" y="169" width="27.6" height="14" rx="3" fill="#00cc66" fill-opacity="0.22"/>
    <rect x="140.4" y="169" width="27.6" height="14" rx="3" fill="#00cc66" fill-opacity="0.22"/>
    <rect x="179" y="185" width="27.6" height="14" rx="3" fill="#00cc66" fill-opacity="0.22"/>
    <rect x="322.5" y="185" width="16.6" height="14" rx="3" fill="#00cc66" fill-opacity="0.22"/>

    <!-- Runtime induction highlights -->
    <rect x="79.6" y="185" width="77.3" height="14" rx="3" fill="#cc2222" fill-opacity="0.25"/>
    <rect x="228.7" y="185" width="77.3" height="14" rx="3" fill="#cc2222" fill-opacity="0.25"/>
    <rect x="134.8" y="201" width="77.3" height="14" rx="3" fill="#cc2222" fill-opacity="0.25"/>
    <rect x="52" y="233" width="77.3" height="14" rx="3" fill="#cc2222" fill-opacity="0.25"/>
    <rect x="52" y="249" width="243" height="14" rx="3" fill="#cc2222" fill-opacity="0.25"/>

    <g fill="#dfe3ed" font-family="monospace" font-size="9.2">
      <text x="41" y="180">u32 end = start + count;</text>
      <text x="41" y="196">while (st-&gt;next_noise &gt;= start &amp;&amp; st-&gt;next_noise &lt; end) {</text>
      <text x="41" y="212">  u32 site_idx = st-&gt;next_noise;</text>
      <text x="41" y="228">  apply_noise_site(st, sites, channels, site_idx);</text>
      <text x="41" y="244">  st-&gt;next_noise = site_idx + 1u;</text>
      <text x="41" y="260">  draw_next_noise(st, hazards, num_sites);</text>
      <text x="41" y="276">}</text>
    </g>

    <path d="M295 257 H458 V196 H380" fill="none" stroke="#cc2222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/>
    <text x="481" y="228" fill="#ff7777" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" transform="rotate(-90 481 228)">trip count ← PRNG</text>

    <circle cx="414" cy="84" r="4" fill="#cc2222"/>
    <text x="423" y="88" fill="#ff8e8e" font-family="Arial, sans-serif" font-size="9.5">runtime cursor</text>
  </g>

  <!-- Centre: the small generated-code win -->
  <g>
    <rect x="535" y="70" width="225" height="232" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#53d8fb" stroke-opacity="0.55"/>
    <rect x="535" y="70" width="225" height="30" rx="9" fill="#53d8fb" fill-opacity="0.10"/>
    <text x="647.5" y="90" fill="#8ee9ff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">THE GENERATED-CODE WIN</text>

    <text x="552" y="122" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5" font-weight="700">LITERAL-BOUND GUARD</text>
    <rect x="551" y="132" width="193" height="49" rx="6" fill="#0d0d1a" stroke="#00cc66" stroke-opacity="0.65"/>
    <text x="563" y="151" fill="#dfe3ed" font-family="monospace" font-size="9.3">st-&gt;next_noise &gt;= start</text>
    <text x="563" y="168" fill="#dfe3ed" font-family="monospace" font-size="9.3">&amp;&amp; st-&gt;next_noise &lt; end</text>

    <line x1="647.5" y1="186" x2="647.5" y2="209" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="660" y="199" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5">bounds fold</text>

    <rect x="558" y="216" width="179" height="43" rx="7" fill="#53d8fb" fill-opacity="0.10" stroke="#53d8fb"/>
    <text x="647.5" y="235" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">one unsigned compare</text>
    <text x="647.5" y="250" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">the range test collapses</text>

    <rect x="590" y="269" width="115" height="21" rx="10.5" fill="#53d8fb" fill-opacity="0.12" stroke="#53d8fb" stroke-opacity="0.75"/>
    <text x="647.5" y="283" fill="#8ee9ff" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">real, and small</text>
  </g>

  <!-- Right: unchanged per-iteration cost -->
  <g>
    <rect x="775" y="70" width="245" height="232" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#e94560" stroke-opacity="0.58"/>
    <rect x="775" y="70" width="245" height="30" rx="9" fill="#e94560" fill-opacity="0.10"/>
    <text x="897.5" y="90" fill="#ffffff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">PER-ITERATION COST</text>
    <text x="897.5" y="108" fill="#ff9aaa" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">unchanged in both forms</text>

    <rect x="793" y="119" width="209" height="39" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#aeb4c7" stroke-opacity="0.55"/>
    <text x="897.5" y="137" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">apply_noise_site</text>
    <text x="897.5" y="151" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">table lookup</text>

    <rect x="793" y="164" width="209" height="45" rx="6" fill="#e94560" fill-opacity="0.10" stroke="#e94560" stroke-opacity="0.62"/>
    <text x="897.5" y="184" fill="#ffffff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">PRNG advance</text>
    <text x="897.5" y="200" fill="#ff9aaa" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">random cursor movement</text>

    <rect x="793" y="215" width="209" height="73" rx="7" fill="url(#runtimeFill)" stroke="#cc2222" stroke-width="2"/>
    <text x="897.5" y="245" fill="#ff7777" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle" filter="url(#glowRed)">ocml_log_f64</text>
    <text x="897.5" y="265" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">the hazard draw</text>
    <text x="897.5" y="280" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">expensive math remains</text>
  </g>

  <!-- Bottom left: exact measured result -->
  <g>
    <rect x="20" y="320" width="555" height="168" rx="9" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.13"/>
    <rect x="20" y="320" width="555" height="29" rx="8" fill="#ffffff" fill-opacity="0.04"/>
    <text x="36" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700">MEASURED RESULT</text>

    <g fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5" font-weight="700">
      <text x="38" y="360">metric</text>
      <text x="292" y="360" text-anchor="middle">interpreter</text>
      <text x="402" y="360" text-anchor="middle">specialized</text>
      <text x="514" y="360" text-anchor="middle">ratio</text>
    </g>
    <line x1="34" y1="367" x2="561" y2="367" stroke="#ffffff" stroke-opacity="0.10"/>

    <g font-family="Arial, sans-serif" font-size="10">
      <text x="38" y="382" fill="#dfe3ed">total instructions</text>
      <text x="292" y="382" fill="#ffffff" text-anchor="middle">447</text>
      <text x="402" y="382" fill="#ffffff" text-anchor="middle">407</text>
      <text x="514" y="382" fill="#00ff80" font-weight="700" text-anchor="middle">1.10×</text>

      <text x="38" y="399" fill="#dfe3ed">VALU</text>
      <text x="292" y="399" fill="#ffffff" text-anchor="middle">214</text>
      <text x="402" y="399" fill="#ffffff" text-anchor="middle">210</text>
      <text x="514" y="399" fill="#ffb35c" font-weight="700" text-anchor="middle">1.02×</text>

      <text x="38" y="416" fill="#dfe3ed">SALU</text>
      <text x="292" y="416" fill="#ffffff" text-anchor="middle">177</text>
      <text x="402" y="416" fill="#ffffff" text-anchor="middle">141</text>

      <text x="38" y="433" fill="#dfe3ed">branches</text>
      <text x="292" y="433" fill="#ffffff" text-anchor="middle">23</text>
      <text x="402" y="433" fill="#ffffff" text-anchor="middle">20</text>

      <text x="38" y="450" fill="#dfe3ed">VGPR</text>
      <text x="292" y="450" fill="#ffffff" text-anchor="middle">56</text>
      <text x="402" y="450" fill="#ffffff" text-anchor="middle">56</text>
      <text x="514" y="450" fill="#ff7777" font-weight="700" text-anchor="middle">no relief</text>

      <text x="38" y="467" fill="#dfe3ed">SGPR</text>
      <text x="292" y="467" fill="#ffffff" text-anchor="middle">86</text>
      <text x="402" y="467" fill="#ffffff" text-anchor="middle">85</text>

      <text x="38" y="484" fill="#dfe3ed" font-family="monospace">s_load</text>
      <text x="292" y="484" fill="#ffffff" text-anchor="middle">9</text>
      <text x="402" y="484" fill="#ffffff" text-anchor="middle">5</text>
    </g>

    <g stroke="#ffffff" stroke-opacity="0.055">
      <line x1="34" y1="386" x2="561" y2="386"/>
      <line x1="34" y1="403" x2="561" y2="403"/>
      <line x1="34" y1="420" x2="561" y2="420"/>
      <line x1="34" y1="437" x2="561" y2="437"/>
      <line x1="34" y1="454" x2="561" y2="454"/>
      <line x1="34" y1="471" x2="561" y2="471"/>
    </g>
  </g>

  <!-- Bottom right: connection to the whole circuit -->
  <g>
    <rect x="590" y="320" width="430" height="168" rx="9" fill="#0d0d1a" fill-opacity="0.72" stroke="#ff8800" stroke-opacity="0.55"/>
    <rect x="590" y="320" width="430" height="29" rx="8" fill="#ff8800" fill-opacity="0.09"/>
    <text x="606" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700">WHY THE FAMILY IS WEAK</text>

    <text x="608" y="369" fill="#ffffff" font-family="monospace" font-size="11.5" font-weight="700">circuit_d5 · 1,720 calls</text>
    <text x="608" y="389" fill="#ffb35c" font-family="Arial, sans-serif" font-size="12" font-weight="700">329 noise/readout · 19.1 %</text>
    <line x1="608" y1="400" x2="1002" y2="400" stroke="#ffffff" stroke-opacity="0.10"/>

    <text x="608" y="421" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">noise op · 447 interpreter-form instructions</text>
    <text x="608" y="439" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">frame op · 136 instructions</text>

    <rect x="608" y="450" width="394" height="27" rx="6" fill="#ff8800" fill-opacity="0.12" stroke="#ff8800" stroke-opacity="0.7"/>
    <text x="620" y="468" fill="#ffb35c" font-family="Arial, sans-serif" font-size="11" font-weight="700">d5 family · 0.786 – 0.856</text>
    <text x="989" y="468" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">the corpus's weakest wins</text>
  </g>

  <!-- Cyan prediction callout -->
  <g>
    <rect x="20" y="500" width="1000" height="47" rx="8" fill="#53d8fb" fill-opacity="0.10" stroke="#53d8fb"/>
    <path d="M38 511 V536 M38 511 H45 M38 536 H45" fill="none" stroke="#53d8fb" stroke-width="2"/>
    <text x="55" y="519" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5">“The prediction §7.9 made from a single microbenchmark, before any of these circuits were measured, was that</text>
    <text x="55" y="537" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">circuit_d5 would be the corpus's weakest coop-tier result. It is.”</text>
  </g>

  <!-- Footer punchline -->
  <rect x="0" y="554" width="1040" height="26" fill="#e94560" fill-opacity="0.14"/>
  <line x1="0" y1="554" x2="1040" y2="554" stroke="#e94560"/>
  <text x="520" y="572" fill="#ffffff" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">“specialization removes the scaffolding, not the math.”</text>
</svg>
