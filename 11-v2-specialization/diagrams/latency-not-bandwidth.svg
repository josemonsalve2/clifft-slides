<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">The Pipe Is 90 % Empty</title>
  <desc id="desc">A wide ~8 TB/s HBM3E supply tapers through a bytes-in-flight aperture to 766 GB/s achieved demand, leaving 90 % of the pipe unused. The successful intervention raises concurrency.</desc>

  <defs>
    <linearGradient id="supplyFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53d8fb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#53d8fb" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ribbonFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.06"/>
      <stop offset="0.38" stop-color="#e94560" stop-opacity="0.10"/>
      <stop offset="0.58" stop-color="#e94560" stop-opacity="0.20"/>
      <stop offset="0.64" stop-color="#e94560" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="headroomTopFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ba3b8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#53d8fb" stop-opacity="0.21"/>
    </linearGradient>
    <linearGradient id="headroomBottomFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53d8fb" stop-opacity="0.21"/>
      <stop offset="1" stop-color="#9ba3b8" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAccent" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="620" fill="#1a1a2e"/>
  <path d="M0 64 H1100 M0 335 H1100 M0 414 H1100 M0 566 H1100" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M45 64 V608 M1055 64 V608" stroke="#ffffff" stroke-opacity="0.025"/>

  <!-- Title -->
  <text x="550" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">The Pipe Is 90 % Empty</text>
  <text x="550" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">766 GB/s of ~8 TB/s — the global tier is latency-bound, so three locality optimizations were decided by one counter</text>

  <!-- Available HBM supply -->
  <rect x="45" y="82" width="231" height="204" rx="10" fill="url(#supplyFill)" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="160.5" y="143" fill="#53d8fb" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">SUPPLY</text>
  <text x="160.5" y="173" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HBM3E — ~8 TB/s peak</text>
  <text x="160.5" y="197" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">MI350X · 288 GB · 8 stacks</text>
  <line x1="82" y1="220" x2="239" y2="220" stroke="#53d8fb" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="82" y1="230" x2="239" y2="230" stroke="#53d8fb" stroke-width="2" stroke-opacity="0.34"/>
  <line x1="82" y1="240" x2="239" y2="240" stroke="#53d8fb" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Unused headroom -->
  <path d="M276 82 H858 V176 H650 C518 158 418 82 276 82 Z" fill="url(#headroomTopFill)"/>
  <path d="M276 286 C418 286 518 214 650 198 H858 V286 Z" fill="url(#headroomBottomFill)"/>
  <path d="M276 82 H858 M276 286 H858" fill="none" stroke="#53d8fb" stroke-width="1" stroke-opacity="0.34" stroke-dasharray="6 5"/>
  <rect x="550" y="94" width="270" height="55" rx="8" fill="#0d0d1a" fill-opacity="0.48" stroke="#53d8fb" stroke-opacity="0.24"/>
  <text x="685" y="114" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">7.2 TB/s of headroom, unused</text>
  <text x="685" y="132" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">90 % of the device's memory bandwidth is idle</text>
  <text x="685" y="145" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">while the kernel runs</text>

  <!-- Achieved flow taper -->
  <path d="M276 82 C418 82 518 158 650 176 H858 V198 H650 C518 214 418 286 276 286 Z" fill="url(#ribbonFill)" stroke="url(#ribbonFill)" stroke-width="1.5"/>
  <path d="M650 176 H858 V198 H650" fill="none" stroke="#e94560" stroke-width="1.2" filter="url(#glowAccent)"/>
  <text x="756" y="164" fill="#ff8aa0" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">2.43 TB in 3.173 s</text>
  <text x="756" y="191" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">766 GB/s achieved · 9.6 %</text>

  <!-- Bytes-in-flight aperture -->
  <ellipse cx="650" cy="187" rx="14" ry="27" fill="none" stroke="#53d8fb" stroke-width="1.7" filter="url(#glowCyan)"/>
  <line x1="650" y1="214" x2="650" y2="229" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="650" y="246" fill="#53d8fb" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">the limiter: bytes in flight</text>
  <text x="650" y="262" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">not the width of the pipe</text>

  <!-- CU demand -->
  <rect x="858" y="82" width="197" height="204" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#e94560" stroke-width="1.5"/>
  <rect x="858" y="82" width="197" height="37" rx="9" fill="#e94560" fill-opacity="0.16"/>
  <text x="956.5" y="106" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">256 CUs · 8 XCDs</text>
  <text x="956.5" y="139" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.7" text-anchor="middle">ARITHMETIC INTENSITY</text>
  <text x="956.5" y="162" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">U2 = 0.9 · U4 = 1.9</text>
  <text x="956.5" y="178" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">flop/byte</text>
  <line x1="878" y1="192" x2="1035" y2="192" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="956.5" y="213" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">machine balance ~20 flop/byte</text>
  <rect x="876" y="228" width="161" height="42" rx="7" fill="#ff8800" fill-opacity="0.12" stroke="#ff8800" stroke-opacity="0.75"/>
  <text x="956.5" y="246" fill="#ffb35c" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">~10x to the memory-bound</text>
  <text x="956.5" y="261" fill="#ffb35c" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">side of the ridge</text>

  <!-- Measurement provenance -->
  <rect x="45" y="300" width="1010" height="31" rx="5" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="550" y="320" fill="#9ba3b8" font-family="monospace" font-size="9.5" text-anchor="middle">FETCH_SIZE 2,375,156,452 KB  /  3,173,389,086 ns  =  766 GB/s      TCC hit rate 68.9 %  (125,637,003,143 req · 39,048,149,329 miss)</text>

  <!-- Little's law and control knobs -->
  <rect x="45" y="340" width="1010" height="70" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.10"/>

  <circle cx="82" cy="376" r="21" fill="#cc2222" fill-opacity="0.12" stroke="#cc2222" stroke-width="2"/>
  <line x1="82" y1="376" x2="72" y2="363" stroke="#ff7777" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="82" cy="376" r="3" fill="#ff7777"/>
  <text x="116" y="355" fill="#ff7777" font-family="Arial, sans-serif" font-size="11" font-weight="700">latency</text>
  <text x="116" y="375" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">hide it — prefetch, staging, placement</text>
  <text x="116" y="396" fill="#cc2222" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">three attempts, all failed</text>

  <text x="550" y="355" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">LITTLE'S LAW</text>
  <text x="550" y="384" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">throughput = concurrency ÷ latency</text>

  <circle cx="1018" cy="376" r="21" fill="#00cc66" fill-opacity="0.12" stroke="#00cc66" stroke-width="2"/>
  <line x1="1018" y1="376" x2="1029" y2="361" stroke="#00ff80" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="1018" cy="376" r="3" fill="#00ff80"/>
  <text x="984" y="355" fill="#67f0a9" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">concurrency</text>
  <text x="984" y="375" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="end">raise it — more resident workgroups</text>
  <text x="984" y="396" fill="#00cc66" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">the one that worked</text>

  <!-- Register prefetch card -->
  <rect x="45" y="420" width="245" height="142" rx="9" fill="#cc2222" fill-opacity="0.07" stroke="#cc2222" stroke-width="1.5"/>
  <rect x="45" y="420" width="245" height="29" rx="8" fill="#cc2222" fill-opacity="0.16"/>
  <text x="167.5" y="439" fill="#ff8888" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Register prefetch (VGPR pipeline)</text>
  <text x="57" y="461" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9">acts on: latency · killed by: the VGPR cap</text>
  <text x="57" y="473" fill="#ffffff" font-family="monospace" font-size="9">.vgpr_count 128 · both arms</text>
  <text x="57" y="485" fill="#ffffff" font-family="monospace" font-size="9">.vgpr_spill_count 152 → 375</text>
  <text x="57" y="497" fill="#dfe3ed" font-family="monospace" font-size="9">bytes 2,375,292,491 →</text>
  <text x="57" y="509" fill="#dfe3ed" font-family="monospace" font-size="9">2,375,404,660 KB (0.005 %)</text>
  <text x="57" y="521" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="9">rank 21 +10.3 % · rank 22 +8.4 %</text>
  <text x="57" y="533" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="9">rank 24 +7.3 % slower</text>
  <rect x="51" y="538" width="233" height="20" rx="5" fill="#0d0d1a" fill-opacity="0.72"/>
  <text x="167.5" y="551" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">prefetched 4 amplitudes by spilling 223 values</text>

  <!-- LDS tiling card -->
  <rect x="300" y="420" width="245" height="142" rx="9" fill="#cc2222" fill-opacity="0.07" stroke="#cc2222" stroke-width="1.5"/>
  <rect x="300" y="420" width="245" height="29" rx="8" fill="#cc2222" fill-opacity="0.16"/>
  <text x="422.5" y="439" fill="#ff8888" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LDS tiling (F8)</text>
  <text x="312" y="463" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5">acts on: reuse</text>
  <text x="312" y="478" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5">killed by: 3 barriers per tile,</text>
  <text x="312" y="492" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5">and a cache that already prefetches a stride</text>
  <text x="312" y="516" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="10" font-weight="700">D5 -66.1 % · D7 -16.5 %</text>
  <text x="312" y="532" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="10" font-weight="700">QEC -6.6 %</text>
  <rect x="306" y="538" width="233" height="20" rx="5" fill="#0d0d1a" fill-opacity="0.72"/>
  <text x="422.5" y="551" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">the butterfly is strided, not random</text>

  <!-- HBM placement card -->
  <rect x="555" y="420" width="245" height="142" rx="9" fill="#cc2222" fill-opacity="0.07" stroke="#cc2222" stroke-width="1.5"/>
  <rect x="555" y="420" width="245" height="29" rx="8" fill="#cc2222" fill-opacity="0.16"/>
  <text x="677.5" y="439" fill="#ff8888" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">HBM stack placement</text>
  <text x="567" y="463" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5">acts on: the pipe</text>
  <text x="567" y="478" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5">killed by: the flow above — 90 % headroom</text>
  <text x="567" y="501" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="9.5">physical addresses interleave</text>
  <text x="567" y="516" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="9.5">across all 8 stacks</text>
  <text x="567" y="531" fill="#ffaaaa" font-family="Arial, sans-serif" font-size="9.5">per-stack placement is not expressible</text>
  <rect x="561" y="538" width="233" height="20" rx="5" fill="#0d0d1a" fill-opacity="0.72"/>
  <text x="677.5" y="551" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">no cross-workgroup sharing to co-locate</text>

  <!-- Resident pool card -->
  <rect x="810" y="420" width="245" height="142" rx="9" fill="#00cc66" fill-opacity="0.07" stroke="#00cc66" stroke-width="1.8"/>
  <rect x="810" y="420" width="245" height="29" rx="8" fill="#00cc66" fill-opacity="0.16"/>
  <text x="926" y="439" fill="#67f0a9" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Resident pool (concurrency)</text>
  <path d="M1022 434 l4 4 l8 -10" fill="none" stroke="#00ff80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="822" y="463" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5">acts on: concurrency</text>
  <text x="822" y="484" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">rank 24: 168 → 680 workgroups</text>
  <text x="822" y="502" fill="#00ff80" font-family="Arial, sans-serif" font-size="11" font-weight="700">4.05x more in flight</text>
  <text x="822" y="523" fill="#00ff80" font-family="monospace" font-size="10" font-weight="700">7.242 s → 3.468 s = 2.09x</text>
  <rect x="816" y="538" width="233" height="20" rx="5" fill="#0d0d1a" fill-opacity="0.72"/>
  <text x="932.5" y="551" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">the only knob that was actually turned down</text>

  <!-- Punchline -->
  <rect x="45" y="572" width="1010" height="34" rx="9" fill="#e94560" fill-opacity="0.14" stroke="#e94560"/>
  <text x="550" y="594" fill="#ffffff" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">A kernel that uses 9.6 % of its bandwidth cannot be helped by moving bytes closer. It can only be helped by asking for more of them at once.</text>
</svg>
