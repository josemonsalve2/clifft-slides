<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600" role="img" aria-labelledby="title desc">
  <title id="title">The Register Allocator Falls Off a Cliff at Rank 22</title>
  <desc id="desc">Register allocation and V2-to-SVM ratio by rank. Ranks 20 through 21 remain below the VGPR and AGPR caps with no spills; ranks 22 through 24 hit both caps, spill to HBM-backed scratch, and lose their performance advantage.</desc>

  <defs>
    <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff80" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#00cc66" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="redFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5555" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="orangeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ff8800" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cc2222"/>
    </marker>
  </defs>

  <rect width="1060" height="600" fill="#1a1a2e"/>
  <path d="M0 59 H1060 M0 550 H1060" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M25 0 V600 M1035 0 V600" stroke="#ffffff" stroke-opacity="0.025"/>

  <!-- Title -->
  <text x="530" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">The Register Allocator Falls Off a Cliff at Rank 22</text>
  <text x="530" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Spilling begins and the advantage collapses at the same rank — and the spilling kernels are the shortest in the corpus</text>

  <!-- Top panel -->
  <rect x="25" y="68" width="1010" height="319" rx="11" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="42" y="85" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11" font-weight="700">AMDHSA ALLOCATION METADATA</text>
  <text x="1018" y="85" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="end">allocated registers against the hardware cap</text>

  <!-- Rank labels -->
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <text x="150" y="99">20</text>
    <text x="290" y="99">20(L8)</text>
    <text x="430" y="99">21</text>
    <text x="650" y="99">22</text>
    <text x="790" y="99">23</text>
    <text x="930" y="99">24</text>
  </g>

  <!-- Cap rules -->
  <text x="42" y="112" fill="#9ba3b8" font-family="monospace" font-size="10">VGPR cap 128</text>
  <line x1="126" y1="107" x2="1018" y2="107" stroke="#dfe3ed" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55"/>
  <text x="42" y="210" fill="#9ba3b8" font-family="monospace" font-size="10">AGPR cap 64</text>
  <line x1="126" y1="205" x2="1018" y2="205" stroke="#dfe3ed" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55"/>

  <!-- Scratch field -->
  <rect x="545" y="299" width="475" height="80" rx="8" fill="#cc2222" fill-opacity="0.10" stroke="#cc2222" stroke-width="1.5"/>

  <!-- Spill paths to scratch -->
  <g fill="none" stroke="#cc2222" stroke-width="5" stroke-linecap="round" opacity="0.84" marker-end="url(#redArrow)">
    <path d="M650 108 C590 153 584 238 620 299"/>
    <path d="M790 108 C741 167 746 243 785 299"/>
    <path d="M930 108 C994 165 994 242 950 299"/>
  </g>

  <!-- Rank 20 allocation -->
  <g>
    <rect x="100" y="123" width="48" height="65" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <rect x="152" y="230" width="48" height="42" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <text x="124" y="141" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">104 VGPR</text>
    <text x="176" y="249" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">40 AGPR</text>
    <text x="150" y="291" fill="#00ff80" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">spill 0</text>
  </g>

  <!-- Rank 20 L8 allocation -->
  <g>
    <rect x="240" y="121" width="48" height="67" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <rect x="292" y="227" width="48" height="45" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <text x="264" y="139" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">106 VGPR</text>
    <text x="316" y="246" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">42 AGPR</text>
    <text x="290" y="291" fill="#00ff80" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">spill 0</text>
  </g>

  <!-- Rank 21 allocation -->
  <g>
    <rect x="380" y="123" width="48" height="65" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <rect x="432" y="230" width="48" height="42" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <text x="404" y="141" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">104 VGPR</text>
    <text x="456" y="249" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">40 AGPR</text>
    <text x="430" y="291" fill="#00ff80" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">spill 0</text>
  </g>

  <!-- Rank 22 allocation -->
  <g>
    <rect x="600" y="107" width="48" height="81" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="2"/>
    <rect x="652" y="205" width="48" height="67" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="2"/>
    <text x="624" y="127" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">128 VGPR</text>
    <text x="676" y="225" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">64 AGPR</text>
  </g>

  <!-- Rank 23 allocation -->
  <g>
    <rect x="740" y="107" width="48" height="81" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="2"/>
    <rect x="792" y="205" width="48" height="67" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="2"/>
    <text x="764" y="127" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">128 VGPR</text>
    <text x="816" y="225" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">64 AGPR</text>
  </g>

  <!-- Rank 24 allocation -->
  <g>
    <rect x="880" y="107" width="48" height="81" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="2"/>
    <rect x="932" y="205" width="48" height="67" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="2"/>
    <text x="904" y="127" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">128 VGPR</text>
    <text x="956" y="225" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">64 AGPR</text>
  </g>

  <!-- Counter-intuitive callout -->
  <rect x="40" y="303" width="455" height="76" rx="8" fill="#53d8fb" fill-opacity="0.08" stroke="#53d8fb" stroke-width="1.2"/>
  <text x="55" y="322" fill="#53d8fb" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Spilling kernels are the shortest in the corpus: 320–359 instructions</text>
  <text x="55" y="341" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10">rank-14: 16,521 instructions · just 4 SGPRs spilled</text>
  <text x="55" y="359" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Spilling tracks rank — live amplitude state — not program length.</text>
  <text x="55" y="374" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="9.5">A longer program is not a harder allocation problem; a wider one is.</text>

  <!-- HBM-backed scratch -->
  <text x="782.5" y="318" fill="#ff7777" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">scratch → HBM · scratch is HBM-backed</text>
  <text x="782.5" y="334" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">Spills trade registers for the memory these kernels are already bandwidth-bound on.</text>
  <g font-family="monospace" text-anchor="middle">
    <text x="620" y="351" fill="#ffffff" font-size="9" font-weight="700">136 VGPR + 762 SGPR</text>
    <text x="620" y="367" fill="#ffaaaa" font-size="10">scratch 448 bytes</text>
    <text x="785" y="351" fill="#ffffff" font-size="9" font-weight="700">199 VGPR + 662 SGPR</text>
    <text x="785" y="367" fill="#ffaaaa" font-size="10">scratch 576 bytes</text>
    <text x="950" y="351" fill="#ffffff" font-size="9" font-weight="700">152 VGPR + 594 SGPR</text>
    <text x="950" y="367" fill="#ffaaaa" font-size="10">scratch 480 bytes</text>
  </g>

  <!-- Bottom panel -->
  <rect x="25" y="394" width="1010" height="150" rx="11" fill="#0d0d1a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="42" y="417" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11" font-weight="700">V2 / SVM RATIO</text>
  <text x="1018" y="417" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="end">lower is better</text>
  <line x1="82" y1="515" x2="995" y2="515" stroke="#dfe3ed" stroke-width="1.5" opacity="0.45"/>

  <!-- Ratio bars -->
  <g>
    <rect x="118" y="466" width="64" height="49" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <text x="150" y="458" fill="#00ff80" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">0.850</text>
    <text x="150" y="535" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">20</text>

    <rect x="258" y="439" width="64" height="76" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <text x="290" y="432" fill="#00ff80" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">0.732</text>
    <text x="290" y="535" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">20(L8)</text>

    <rect x="398" y="440" width="64" height="75" rx="5" fill="url(#greenFill)" stroke="#00cc66" stroke-width="1.5"/>
    <text x="430" y="433" fill="#00ff80" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">0.736</text>
    <text x="430" y="535" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">21</text>

    <rect x="618" y="500" width="64" height="15" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="1.5"/>
    <text x="650" y="493" fill="#ff7777" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">0.980</text>
    <text x="650" y="535" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">22</text>

    <rect x="758" y="503" width="64" height="12" rx="5" fill="url(#redFill)" stroke="#cc2222" stroke-width="1.5"/>
    <text x="790" y="496" fill="#ff7777" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">0.990</text>
    <text x="790" y="535" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">23</text>

    <rect x="898" y="477" width="64" height="38" rx="5" fill="url(#orangeFill)" stroke="#ff8800" stroke-width="1.5"/>
    <text x="930" y="470" fill="#ffb35c" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">0.882</text>
    <text x="930" y="535" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">24</text>
  </g>

  <!-- Shared cliff marker -->
  <line x1="535" y1="68" x2="535" y2="544" stroke="#53d8fb" stroke-width="2" stroke-dasharray="6 6" opacity="0.82" filter="url(#cyanGlow)"/>
  <text x="526" y="228" fill="#53d8fb" stroke="#1a1a2e" stroke-width="5" paint-order="stroke" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 526 228)">spilling begins · advantage collapses · same rank</text>

  <!-- Footer -->
  <rect x="25" y="555" width="1010" height="32" rx="8" fill="#e94560" fill-opacity="0.12" stroke="#e94560" stroke-width="1"/>
  <text x="530" y="576" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Second, independent mechanism — see hbm-budget-pool.svg for the first.</text>
</svg>
