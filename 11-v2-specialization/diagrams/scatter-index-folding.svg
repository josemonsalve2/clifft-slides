<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Three Answers to One Index Computation</title>
  <desc id="desc">Comparison of the V2 interpreter's per-amplitude scatter_bits_2 recomputation, SVM's runtime LDS scatter lookup table, and V2's compile-time folding into constant masks and v_or3, with measured bottleneck statistics and global-interpreter speedups.</desc>

  <defs>
    <linearGradient id="interpreterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc2222" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#cc2222" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="svmFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8800" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff8800" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="foldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAccent" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53d8fb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8800"/>
    </marker>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e94560"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#1a1a2e"/>
  <path d="M0 63 H1100 M0 414 H1100 M0 540 H1100" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M24 0 V620 M1076 0 V620" stroke="#ffffff" stroke-opacity="0.025"/>

  <text x="550" y="31" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Three Answers to One Index Computation</text>
  <text x="550" y="50" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">scatter_bits_2 → insert_zero_bit · the global tier's bottleneck (commit 5d10409)</text>

  <!-- Interpreter panel -->
  <g>
    <rect x="24" y="76" width="320" height="334" rx="10" fill="url(#interpreterFill)" stroke="#cc2222" stroke-width="2"/>
    <rect x="24" y="76" width="320" height="36" rx="9" fill="#cc2222" fill-opacity="0.28"/>
    <text x="184" y="99" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">V2 INTERPRETER</text>

    <rect x="40" y="124" width="288" height="54" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#cc2222" stroke-opacity="0.85"/>
    <text x="184" y="148" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glowRed)">2.34B vs 1.18B VALU</text>
    <text x="184" y="166" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">2× the VALU · same wall time</text>

    <text x="184" y="199" fill="#dfe3ed" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">scatter_bits_2 per amplitude</text>

    <g font-family="monospace" font-size="9" text-anchor="middle">
      <circle cx="47" cy="224" r="6" fill="#cc2222"/>
      <rect x="62" y="214" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="85" y="228" fill="#dfe3ed">SHIFT</text>
      <line x1="108" y1="224" x2="115" y2="224" stroke="#cc2222"/>
      <rect x="115" y="214" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="138" y="228" fill="#dfe3ed">MASK</text>
      <line x1="161" y1="224" x2="168" y2="224" stroke="#cc2222"/>
      <rect x="168" y="214" width="97" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="216.5" y="228" fill="#dfe3ed">insert_zero_bit</text>
      <line x1="265" y1="224" x2="272" y2="224" stroke="#cc2222"/>
      <rect x="272" y="214" width="48" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="296" y="228" fill="#dfe3ed">OR</text>

      <circle cx="47" cy="251" r="6" fill="#cc2222"/>
      <rect x="62" y="241" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="85" y="255" fill="#dfe3ed">SHIFT</text>
      <line x1="108" y1="251" x2="115" y2="251" stroke="#cc2222"/>
      <rect x="115" y="241" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="138" y="255" fill="#dfe3ed">MASK</text>
      <line x1="161" y1="251" x2="168" y2="251" stroke="#cc2222"/>
      <rect x="168" y="241" width="97" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="216.5" y="255" fill="#dfe3ed">insert_zero_bit</text>
      <line x1="265" y1="251" x2="272" y2="251" stroke="#cc2222"/>
      <rect x="272" y="241" width="48" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="296" y="255" fill="#dfe3ed">OR</text>

      <circle cx="47" cy="278" r="6" fill="#cc2222"/>
      <rect x="62" y="268" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="85" y="282" fill="#dfe3ed">SHIFT</text>
      <line x1="108" y1="278" x2="115" y2="278" stroke="#cc2222"/>
      <rect x="115" y="268" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="138" y="282" fill="#dfe3ed">MASK</text>
      <line x1="161" y1="278" x2="168" y2="278" stroke="#cc2222"/>
      <rect x="168" y="268" width="97" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="216.5" y="282" fill="#dfe3ed">insert_zero_bit</text>
      <line x1="265" y1="278" x2="272" y2="278" stroke="#cc2222"/>
      <rect x="272" y="268" width="48" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="296" y="282" fill="#dfe3ed">OR</text>

      <circle cx="47" cy="305" r="6" fill="#cc2222"/>
      <rect x="62" y="295" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="85" y="309" fill="#dfe3ed">SHIFT</text>
      <line x1="108" y1="305" x2="115" y2="305" stroke="#cc2222"/>
      <rect x="115" y="295" width="46" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="138" y="309" fill="#dfe3ed">MASK</text>
      <line x1="161" y1="305" x2="168" y2="305" stroke="#cc2222"/>
      <rect x="168" y="295" width="97" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="216.5" y="309" fill="#dfe3ed">insert_zero_bit</text>
      <line x1="265" y1="305" x2="272" y2="305" stroke="#cc2222"/>
      <rect x="272" y="295" width="48" height="20" rx="4" fill="#0d0d1a" stroke="#cc2222"/>
      <text x="296" y="309" fill="#dfe3ed">OR</text>
    </g>

    <text x="184" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">× 256 per shot</text>
    <rect x="67" y="352" width="234" height="42" rx="7" fill="#cc2222" fill-opacity="0.22" stroke="#cc2222"/>
    <text x="184" y="378" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">~8–12 VALU each</text>
  </g>

  <!-- Runtime transition -->
  <g>
    <text x="367" y="220" fill="#53d8fb" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">runtime</text>
    <line x1="350" y1="238" x2="384" y2="238" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- SVM panel -->
  <g>
    <rect x="390" y="76" width="320" height="334" rx="10" fill="url(#svmFill)" stroke="#ff8800" stroke-width="2"/>
    <rect x="390" y="76" width="320" height="36" rx="9" fill="#ff8800" fill-opacity="0.25"/>
    <text x="550" y="99" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SVM RUNTIME SCATTER LUT</text>

    <rect x="406" y="124" width="288" height="54" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#53d8fb" stroke-opacity="0.85"/>
    <text x="550" y="148" fill="#53d8fb" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glowCyan)">25× more L2 misses</text>
    <text x="550" y="166" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">V2 global vs SVM · same wall time</text>

    <rect x="406" y="190" width="288" height="94" rx="7" fill="#0d0d1a" fill-opacity="0.72" stroke="#ff8800" stroke-width="1.5"/>
    <rect x="406" y="190" width="288" height="27" rx="6" fill="#ff8800" fill-opacity="0.19"/>
    <text x="550" y="208" fill="#ffb35c" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">scatter_lut[kSharedMaxAmplitudes/2]</text>
    <text x="550" y="235" fill="#dfe3ed" font-family="monospace" font-size="10" text-anchor="middle">(axis1, axis2, k, mode)</text>
    <path d="M422 247 H678 M422 264 H678 M478 217 V284 M622 217 V284" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="422" y="247" width="56" height="17" fill="#ff8800" fill-opacity="0.12"/>
    <rect x="622" y="264" width="56" height="17" fill="#ff8800" fill-opacity="0.12"/>

    <line x1="550" y1="285" x2="550" y2="302" stroke="#ff8800" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <rect x="465" y="304" width="170" height="28" rx="6" fill="#ff8800" fill-opacity="0.16" stroke="#ff8800"/>
    <text x="550" y="323" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">per-amplitude load</text>

    <rect x="406" y="344" width="288" height="52" rx="7" fill="#cc2222" fill-opacity="0.22" stroke="#cc2222" stroke-width="1.5"/>
    <text x="550" y="362" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SVM leaves this LUT OFF for the global tier.</text>
    <text x="550" y="378" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">That is precisely why V2's global specialization</text>
    <text x="550" y="391" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">wins so decisively.</text>
  </g>

  <!-- Compile-time transition -->
  <g>
    <text x="733" y="220" fill="#53d8fb" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">fold</text>
    <line x1="716" y1="238" x2="750" y2="238" stroke="#53d8fb" stroke-width="2" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- Compile-time fold panel -->
  <g>
    <rect x="756" y="76" width="320" height="334" rx="10" fill="url(#foldFill)" stroke="#e94560" stroke-width="2"/>
    <rect x="756" y="76" width="320" height="36" rx="9" fill="#e94560" fill-opacity="0.28"/>
    <text x="916" y="99" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">V2 COMPILE-TIME FOLD</text>

    <text x="916" y="134" fill="#53d8fb" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FOLD INDEX ARITHMETIC AT COMPILE TIME</text>

    <g font-family="monospace" font-size="9" text-anchor="middle">
      <rect x="772" y="148" width="88" height="30" rx="6" fill="#0d0d1a" stroke="#e94560"/>
      <text x="816" y="167" fill="#dfe3ed">constant mask</text>
      <rect x="872" y="148" width="88" height="30" rx="6" fill="#0d0d1a" stroke="#e94560"/>
      <text x="916" y="167" fill="#dfe3ed">constant mask</text>
      <rect x="972" y="148" width="88" height="30" rx="6" fill="#0d0d1a" stroke="#e94560"/>
      <text x="1016" y="167" fill="#dfe3ed">constant mask</text>
    </g>
    <text x="916" y="193" fill="#aeb4c7" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">three constant masks</text>

    <path d="M816 179 V199 H916 M916 179 V204 M1016 179 V199 H916" fill="none" stroke="#e94560" stroke-width="1.5"/>
    <line x1="916" y1="199" x2="916" y2="211" stroke="#e94560" stroke-width="2" marker-end="url(#arrowAccent)"/>

    <rect x="839" y="215" width="154" height="72" rx="7" fill="#0d0d1a" fill-opacity="0.82" stroke="#e94560" stroke-width="2"/>
    <text x="916" y="239" fill="#dfe3ed" font-family="monospace" font-size="11" text-anchor="middle">scatter_bits_2</text>
    <line x1="871" y1="251" x2="961" y2="251" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="916" y="274" fill="#ffffff" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle" filter="url(#glowAccent)">v_or3</text>

    <text x="916" y="312" fill="#e94560" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">strictly better:</text>
    <rect x="790" y="326" width="252" height="64" rx="8" fill="#e94560" fill-opacity="0.14" stroke="#e94560"/>
    <text x="916" y="350" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">no table, no LDS for the table,</text>
    <text x="916" y="373" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">no lookup</text>
  </g>

  <!-- Results strip -->
  <g>
    <rect x="24" y="426" width="1052" height="106" rx="10" fill="#0d0d1a" fill-opacity="0.72" stroke="#00cc66" stroke-opacity="0.7"/>
    <text x="550" y="447" fill="#9ba3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">SPEEDUP OVER THE GLOBAL INTERPRETER</text>

    <rect x="42" y="458" width="300" height="42" rx="7" fill="#00cc66" fill-opacity="0.11" stroke="#00cc66"/>
    <text x="62" y="484" fill="#dfe3ed" font-family="monospace" font-size="11">surface_d7_t19</text>
    <text x="322" y="486" fill="#00ff80" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="end">3.37×</text>

    <rect x="400" y="458" width="300" height="42" rx="7" fill="#00cc66" fill-opacity="0.11" stroke="#00cc66"/>
    <text x="420" y="484" fill="#dfe3ed" font-family="monospace" font-size="11">surface_d9_t19</text>
    <text x="680" y="486" fill="#00ff80" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="end">3.78×</text>

    <rect x="758" y="458" width="300" height="42" rx="7" fill="#00cc66" fill-opacity="0.11" stroke="#00cc66"/>
    <text x="778" y="484" fill="#dfe3ed" font-family="monospace" font-size="11">surface_d11_t15</text>
    <text x="1038" y="486" fill="#00ff80" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="end">3.87×</text>

    <text x="550" y="521" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">progressive table: ~1.0 to ~0.26–0.31 in a single step</text>
  </g>

  <!-- Punchline -->
  <g>
    <rect x="24" y="550" width="1052" height="48" rx="9" fill="#e94560" fill-opacity="0.14" stroke="#e94560"/>
    <text x="550" y="580" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SVM's answer was a runtime table. V2's answer was to not need one.</text>
  </g>
</svg>
