  <g>
    <rect x="40" y="365" width="22" height="22" rx="11" fill="#cc2222" fill-opacity="0.28" stroke="#cc2222"/>
    <text x="51" y="380" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">E</text>
    <text x="72" y="380" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">u2</text>
    <rect x="232" y="365" width="96" height="28" rx="4" fill="#cc2222" fill-opacity="0.20" stroke="#cc2222"/>
    <text x="280" y="383" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">uint32_t cp_idx</text>
    <rect x="328" y="365" width="480" height="28" rx="4" fill="url(#paddingHatch)" stroke="#cc2222" stroke-opacity="0.35"/>
    <text x="344" y="383" fill="#53d8fb" font-family="monospace" font-size="9">→ fused_u2_nodes</text>
  </g>

  <!-- Variant F -->
  <g>
    <rect x="40" y="397" width="22" height="22" rx="11" fill="#cc2222" fill-opacity="0.28" stroke="#cc2222"/>
    <text x="51" y="412" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">F</text>
    <text x="72" y="412" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">u4</text>
    <rect x="232" y="397" width="96" height="28" rx="4" fill="#cc2222" fill-opacity="0.20" stroke="#cc2222"/>
    <text x="280" y="415" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">uint32_t cp_idx</text>
    <rect x="328" y="397" width="480" height="28" rx="4" fill="url(#paddingHatch)" stroke="#cc2222" stroke-opacity="0.35"/>
    <text x="344" y="415" fill="#53d8fb" font-family="monospace" font-size="9">→ fused_u4_nodes</text>
  </g>

  <!-- Variant G -->
  <g>
    <rect x="40" y="429" width="22" height="22" rx="11" fill="#cc2222" fill-opacity="0.28" stroke="#cc2222"/>
    <text x="51" y="444" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">G</text>
    <text x="72" y="444" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">exp_val</text>
    <rect x="232" y="429" width="192" height="28" rx="4" fill="#cc2222" fill-opacity="0.20" stroke="#cc2222"/>
    <text x="328" y="441" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">uint32_t cp_exp_val_idx,</text>
    <text x="328" y="452" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">exp_val_idx</text>
    <rect x="424" y="429" width="384" height="28" rx="4" fill="url(#paddingHatch)" stroke="#cc2222" stroke-opacity="0.35"/>
  </g>

  <!-- Raw payload access -->
  <g>
    <rect x="40" y="461" width="22" height="22" rx="11" fill="#53d8fb" fill-opacity="0.16" stroke="#53d8fb"/>
    <text x="51" y="476" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">—</text>
    <text x="72" y="476" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">raw[24]</text>
    <rect x="232" y="461" width="576" height="28" rx="4" fill="#53d8fb" fill-opacity="0.08" stroke="#53d8fb" stroke-opacity="0.75"/>
    <text x="520" y="479" fill="#dfe3ed" font-family="monospace" font-size="9" text-anchor="middle">full payload access</text>
  </g>

  <!-- ConstantPool indirection -->
  <path d="M808 379 H820 M808 411 H820 M808 443 H820 M820 379 V443" fill="none" stroke="#cc2222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="820" y1="411" x2="840" y2="411" stroke="#cc2222" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="840" y="331" width="240" height="124" rx="10" fill="url(#poolFill)" stroke="#e94560" stroke-width="2"/>
  <rect x="840" y="331" width="240" height="31" rx="9" fill="#e94560" fill-opacity="0.20"/>
  <text x="960" y="352" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">ConstantPool</text>
  <text x="960" y="378" fill="#ff9aaa" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">device buffer</text>
  <text x="960" y="400" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">fused 2×2 / 4×4 unitaries,</text>
  <text x="960" y="418" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">N-bit Pauli masks,</text>
  <text x="960" y="436" fill="#dfe3ed" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">noise-channel tables</text>

  <!-- Specialization limit -->
  <rect x="831" y="470" width="258" height="55" rx="8" fill="#53d8fb" fill-opacity="0.08" stroke="#53d8fb" stroke-opacity="0.65"/>
  <text x="868.3" y="492" filter="url(#glowCyan)" fill="#53d8fb" font-family="Arial, sans-serif" font-size="11">the</text><text x="886.3" y="492" filter="url(#glowCyan)" fill="#53d8fb" font-family="Arial, sans-serif" font-size="11" font-weight="700">index</text><text x="917.8" y="492" filter="url(#glowCyan)" fill="#53d8fb" font-family="Arial, sans-serif" font-size="11">folds to an immediate;</text>
  <text x="863.8" y="511" fill="#53d8fb" font-family="Arial, sans-serif" font-size="11">the</text><text x="881.8" y="511" fill="#53d8fb" font-family="Arial, sans-serif" font-size="11" font-weight="700">contents</text><text x="930.6" y="511" fill="#53d8fb" font-family="Arial, sans-serif" font-size="11">stay in a device buffer</text>

  <!-- Punchline -->
  <rect x="20" y="550" width="1060" height="54" rx="10" fill="#e94560" fill-opacity="0.13" stroke="#e94560"/>
  <text x="550" y="583" fill="#ffffff" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Everything left of byte 8 is a compile-time constant. §7's S6 and S8 measure exactly what the right-hand side costs.</text>
</svg>
